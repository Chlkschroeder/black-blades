/* =========================================================
   SCENE FLOW
   ========================================================= */
function goto(id) {
  if (typeof id === 'function') id = id();
  const prev = SCENES[G.scene];
  if (prev && prev.leave && G.scene !== id) prev.leave();
  if (id.startsWith('combat:')) { G.resp = null; startCombat(id.slice(7)); render(); return; }
  G.scene = id; G.resp = null; G.mode = 'scene';
  setF('v_' + id);
  const sc = SCENES[id];
  if (sc.enter) sc.enter();
  autoSave();
  render();
  if (!HEADLESS) window.scrollTo({ top: 0, behavior: 'smooth' });
}
function visibleChoices(sc) {
  return sc.choices.filter(ch => (!ch.if || ch.if()) && !(isOnce(ch) && G.used[G.scene + ':' + ch.k]));
}
function isOnce(ch) { return ch.once !== undefined ? ch.once : !ch.go; }
function choose(k) {
  const sc = SCENES[G.scene];
  const ch = sc.choices.find(c => c.k === k);
  if (!ch) return;
  if (isOnce(ch)) G.used[G.scene + ':' + k] = true;
  const pt = sc.patrol ? patrolTick(ch) : null;
  if (ch.run) {
    const res = ch.run();
    if (!res) { if (pt) return applyOutcome({ patrol: pt }, null); render(); return; }
    return applyOutcome({ ...res, patrol: pt }, res.rolls);
  }
  if (ch.check) {
    const r = runCheck(ch.check);
    const heroRoll = (ch.check.mode || 'hero') === 'hero';
    if (!r.ok && heroRoll && G.hero.res.inspiration) {
      G.resp = { rolls: r.results.map(x => x.line), ok: false, inspire: { k, ch, pt }, t: null, go: null };
      render(); return;
    }
    return applyOutcome({ ...(r.ok ? ch.ok : ch.fail), patrol: pt }, r, r.ok);
  }
  applyOutcome({ t: ch.t, do: ch.do, go: ch.go, patrol: pt }, null);
}
function useInspiration(accept) {
  const p = G.resp.inspire; const ch = p.ch;
  if (accept) { return applyOutcome({ ...ch.fail, patrol: p.pt }, { results: [], ok: false }, false, true); }
  G.hero.res.inspiration = 0;
  log('Heroic Inspiration: rerolling.', 'good');
  const r = runCheck(ch.check);
  applyOutcome({ ...(r.ok ? ch.ok : ch.fail), patrol: p.pt }, r, r.ok);
}
function applyOutcome(out, r, ok, keepRolls) {
  const rollLines = r && r.results ? r.results.map(x => x.line + (x.ok ? ' — success' : ' — failure')) : [];
  if (r && r.summary) rollLines.push(r.summary);
  let text = out.t;
  if (out.do) out.do(r);
  if (typeof text === 'function') text = text();
  let go = typeof out.go === 'function' ? out.go() : out.go;
  if (out.patrol) {
    const pt = out.patrol;
    if (pt.rolls) pt.rolls.forEach(x => rollLines.push(x.line + (x.ok ? ' — success' : ' — failure')));
    text = (text ? text + '\n\n' : '') + pt.t;
    if (pt.go) go = pt.go;
  }
  if (!text && !rollLines.length && go) { goto(go); return; }
  G.resp = { t: text || '', rolls: keepRolls && G.resp ? G.resp.rolls : rollLines, ok, go: go || null };
  render();
}
function respContinue() { const go = G.resp && G.resp.go; G.resp = null; if (go) goto(go); else render(); }

/* =========================================================
   NEW GAME
   ========================================================= */
function newGame(o) {
  G = freshState();
  G.hero = buildHero(o.hero, o);
  G.startSk = o.sidekick || null;
  G.game = 'black_blades';
  log(`${G.hero.name} sets out for Blasingdell.`, 'narr');
  if (o.sidekick) recruit(o.sidekick, o.tactic || 'defensive');
  G.gold = 20;
  G.n.trust_orsik = 0;
  G.mode = 'intro';
  render();
  if (!HEADLESS) window.scrollTo({ top: 0 });
}
function beginAdventure() { goto('arrival_' + G.hero.id); }

/* =========================================================
   SAVE / LOAD
   ========================================================= */
const SAVE_KEY = 'blackblades_quick', AUTO_KEY = 'blackblades_auto';
function store(key, val) { try { if (!HEADLESS) localStorage.setItem(key, val); return true; } catch (e) { return false; } }
function fetchStore(key) { try { return HEADLESS ? null : localStorage.getItem(key); } catch (e) { return null; } }
function autoSave() { if (G && G.hero && G.mode === 'scene') store(AUTO_KEY, JSON.stringify(G)); }
function quickSave() { if (G.mode === 'combat') return false; const ok = store(SAVE_KEY, JSON.stringify({ ...G, savedAt: new Date().toISOString() })); toast(ok ? 'Game saved in this browser.' : 'This browser blocked saving. Use Export save file instead.'); return ok; }
function loadFrom(json) {
  try {
    const o = JSON.parse(json);
    if (!o || !o.hero || o.v !== 1) throw new Error('bad');
    G = o; C = null; G.mode = 'scene'; G.resp = null;
    if (!SCENES[G.scene]) G.scene = 'hub_square';
    closeModal(); render(); toast('Save loaded.');
    return true;
  } catch (e) { toast('That file isn\u2019t a Black Blades save.'); return false; }
}
const IS_IOS = !HEADLESS && (/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
function exportSave() {
  if (HEADLESS) return;
  const data = JSON.stringify({ ...G, savedAt: new Date().toISOString() }, null, 1);
  const name = `black-blades-${G.hero.name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]+/g, '') || 'hero'}-${f('prologue_complete') ? 'complete' : 'act' + G.act}.json`;
  if (IS_IOS && navigator.canShare) {
    try {
      const file = new File([data], name, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: 'Black Blades save' }).then(() => toast('Save file shared. Choose "Save to Files" to keep it.')).catch(() => {}); return; }
    } catch (e) { /* fall through to download */ }
  }
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Save file exported.');
}
function importSave() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const fl = inp.files[0]; if (!fl) return; const rd = new FileReader(); rd.onload = () => loadFrom(rd.result); rd.readAsText(fl); };
  inp.click();
}

/* =========================================================
   RENDERING
   ========================================================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function md(s) {
  return esc(fmt(s)).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function paras(s) { return String(s).split(/\n\n/).map(p => `<p>${md(p.trim())}</p>`).join(''); }
const $ = id => document.getElementById(id);

function render() {
  if (HEADLESS) return;
  const root = $('story');
  document.body.dataset.mode = G ? G.mode : 'title';
  if (!G || G.mode === 'title') { root.innerHTML = titleHTML(); $('side').innerHTML = ''; return; }
  if (G.mode === 'select') { root.innerHTML = selectHTML(); $('side').innerHTML = ''; return; }
  if (G.mode === 'intro') { root.innerHTML = introHTML(); $('side').innerHTML = ''; return; }
  if (G.mode === 'gameover') { root.innerHTML = gameoverHTML(); renderSide(); return; }
  if (G.mode === 'combat' && C) root.innerHTML = combatHTML();
  else root.innerHTML = sceneHTML();
  renderSide();
  if (G.mode === 'combat' && C) { const lg = $('clog'); if (lg) lg.scrollTop = lg.scrollHeight; }
  if (G.tmp.chasePending && C) showChase();
}

/* ---------- scene ---------- */
function sceneText(sc) {
  return sc.text.map(seg => {
    if (typeof seg === 'string') return paras(seg);
    if (seg.if && !seg.if()) return '';
    const t = typeof seg.t === 'function' ? seg.t() : seg.t;
    return paras(t);
  }).join('');
}
function checkHint(ch) {
  if (!ch.check) return '';
  const c = ch.check;
  const sks = (Array.isArray(c.skill) ? c.skill : [c.skill]).map(s => SKILL_NAME[s]).join(' or ');
  const dc = typeof c.dc === 'function' ? c.dc() : c.dc;
  return `<span class="hint-chk">${sks} DC ${dc}${c.mode === 'group' ? ', group' : ''}</span>`;
}
function sceneHTML() {
  const sc = SCENES[G.scene];
  let h = `<article class="scene">${actBanner()}<h2>${esc(sc.title || '')}</h2>${sceneText(sc)}`;
  if (G.resp) {
    const r = G.resp;
    h += `<div class="resp ${r.ok === true ? 'ok' : r.ok === false ? 'no' : ''}">`;
    if (r.rolls && r.rolls.length) h += `<div class="rolls">${r.rolls.map(l => `<div class="roll">${stamp(l)}<span>${esc(l)}</span></div>`).join('')}</div>`;
    if (r.inspire) {
      h += `<p class="insp">The roll failed. ${esc(G.hero.name.split(' ')[0])} can spend Heroic Inspiration to reroll it.</p><div class="choices"><button class="choice" onclick="useInspiration(false)">Reroll with Heroic Inspiration</button><button class="choice" onclick="useInspiration(true)">Accept the result</button></div></div></article>`;
      return h;
    }
    if (r.t) h += paras(r.t);
    h += `</div>`;
    if (r.go) { h += `<div class="choices"><button class="choice cont" onclick="respContinue()">Continue</button></div></article>`; return h; }
  }
  const chs = visibleChoices(sc);
  h += `<div class="choices">` + chs.map(ch => {
    const vis = ch.visited && f('v_' + ch.visited) ? ' <span class="visited">visited</span>' : '';
    return `<button class="choice" onclick="choose('${ch.k}')">${ch.tag ? `<span class="tag">${esc(ch.tag)}</span>` : ''}<span class="cl">${md(typeof ch.label === 'function' ? ch.label() : ch.label)}${vis}</span>${checkHint(ch)}</button>`;
  }).join('') + `</div></article>`;
  return h;

  const sk = Object.keys(SKILLS).map(s => `<li class="${u.skills[s] ? 'prof' : ''}">${SKILL_NAME[s]} <span>${sgn(skillBonus(u, s))}${u.skills[s] === 2 ? ' ★' : ''}</span></li>`).join('');
  const weps = u.weapons.map(w => { const { W, am, bonus } = weaponAtk(u, w); return `<li><strong>${W.name}</strong> ${sgn(bonus)} to hit, ${W.die}${sgn(am)}${W.mastery ? `<small>${MASTERY_NOTE[W.mastery]}</small>` : ''}</li>`; }).join('');
  const spells = u.caster ? `<h3>Spells</h3><p>Attack ${sgn(spellAtk(u))}, save DC ${spellDC(u)}, slots ${u.slots}/${u.slotMax}${u.slotMax2 ? `, 2nd-level ${u.slots2}/${u.slotMax2}` : ''}</p><ul class="sp">${knownSpells(u).concat((u.prepared || []).filter(x => SPELLS[x] && SPELLS[x].type === 'reaction')).map(id => `<li>${SPELLS[id].name}${SPELLS[id].lvl === 0 ? ' (cantrip)' : ''}</li>`).join('')}</ul>` : '';
  const sks = G.sidekicks.filter(s => s.alive && s.inParty).map(s => `<div class="sk"><strong>${s.name}</strong> ${s.role} ${s.level}: AC ${s.ac}, ${s.hp}/${s.hpMax} HP${s.caster ? `, slots ${s.slots}/${s.slotMax}` : ''}. Loyalty ${num('loyalty_' + s.id) >= 0 ? '+' : ''}${num('loyalty_' + s.id)}.<br><small>${s.feats.join(' · ')}</small></div>`).join('');
  showModal(`<h2>${esc(u.name)}</h2>
    <p class="muted">${SPECIES[u.species].name} ${u.cls} ${u.level} · ${HEROES[u.id].bg} background · ${u.kitLabel} kit</p>
    <div class="abils">${abil}</div>
    <p>AC ${acOf2(u)} · HP ${u.hp}/${u.hpMax} · Proficiency +${prof(u)} · Initiative ${sgn(mod(u.abilities.dex) + (u.alert ? prof(u) : 0))}${u.dv ? ` · Darkvision ${u.dv} ft` : ''}</p>
    <div class="two"><div><h3>Skills</h3><ul class="skills">${sk}</ul></div>
    <div><h3>Weapons</h3><ul class="weps">${weps}</ul>${spells}<h3>Features</h3><p class="small">${u.feats.join(' · ')}. ${SPECIES[u.species].note}</p></div></div>
    ${sks ? `<h3>Companions</h3>${sks}` : ''}`);
}
function gameoverHTML() {
  return `<article class="scene over"><h2>The trail ends here</h2><p>${esc(G.hero.name)} has fallen. The black blades will keep moving north without anyone to follow them.</p>
  <div class="choices">
    ${fetchStore(AUTO_KEY) ? `<button class="choice" onclick="loadFrom(fetchStore(AUTO_KEY))">Retry from the last scene</button>` : ''}
    ${fetchStore(SAVE_KEY) ? `<button class="choice" onclick="loadFrom(fetchStore(SAVE_KEY))">Load quick-save</button>` : ''}
    <button class="choice" onclick="importSave()">Load a save file</button>
    <button class="choice" onclick="startSelect()">Start over with a new hero</button>
  </div></article>`;
}

/* ---------- boot ---------- */
if (!HEADLESS) {
  window.addEventListener('DOMContentLoaded', () => { G = null; render(); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}

</script>
</body>
</html>
