/* ---------- Ford helpers ---------- */
function fordDC(base, kind) {
  let dc = base;
  const v = G.tmp.vantage;
  if (kind === 'stealth' && v === 'boat') dc += 2;
  if (kind === 'eaves' && v === 'willows') dc += 2;
  if (kind === 'eaves' && v === 'boat') dc -= 3;
  if (num('susp') >= 2) dc += 2;
  return dc;
}
const stealthBonus = () => (G.tmp.vantage === 'willows' ? 2 : 0);
function raiseSusp(n, why) {
  G.n.susp = Math.min(3, num('susp') + n);
  const msg = ['', 'The guard squints toward your hiding place.', 'The lantern swings toward you.', 'A shout! You\u2019ve been seen.'][G.n.susp];
  log(msg, 'bad');
  return G.n.susp >= 3;
}
function toCombat(text, tail) { G.tmp.fordTail = !!tail; return { t: text + '\n\n*A shout goes up. Steel comes out.*', go: 'combat:ford' }; }
function fordEavesdrop() {
  addN('ford_actions', 1);
  const r = runCheck({ skill: 'perception', dc: fordDC(13, 'eaves'), bonus: f('nyssa_knows_ford') ? 2 : 0 });
  if (r.ok) { setF('knows_password', 'heard_lantern_man', 'heard_grey_one');
    return { rolls: r, t: `{Name} catches it all. The driver, Corvin, counts out silver and grumbles that the Lantern Man wants better quality for the price. The big orc snarls that the big one wants more silver, more each time, or the blades go somewhere else. Corvin hisses back: "Then he can ferry them to the Grey One himself." And as they part, the driver murmurs the watchword for the next meeting: *"Low water."*` }; }
  setF('heard_lantern_man');
  const s = runCheck({ skill: 'stealth', dc: fordDC(12, 'stealth'), bonus: stealthBonus() });
  const rolls = { results: [...r.results, ...s.results] };
  if (!s.ok && raiseSusp(s.by <= -5 ? 3 : 1)) return { rolls, ...toCombat('Fragments only: silver, blades, "the Lantern Man." Then a twig snaps under you.', false) };
  return { rolls, t: `Fragments only. Silver, blades, "the Lantern Man."` };
}
function fordMark(how) {
  addN('ford_actions', 1); setF('mark_tried');
  let r, rolls = [];
  if (how === 'kestrel') {
    const k = skObj('kestrel') || buildGuest('kestrel');
    const x = rollCheck(k, 'stealth', fordDC(12, 'stealth'), { bonus: stealthBonus() }); log(x.line + (x.ok ? ' ✓' : ' ✗'), 'roll');
    r = { ok: x.ok, by: x.by, results: [x] };
  } else if (how === 'teodor') {
    const a = runCheck({ skill: 'stealth', dc: fordDC(12, 'stealth'), bonus: stealthBonus() });
    if (a.ok) { const b = runCheck({ skill: 'sleight', dc: 10 }); r = { ok: b.ok, by: b.by, results: [...a.results, ...b.results] }; }
    else r = a;
  } else r = runCheck({ skill: 'stealth', dc: fordDC(14, 'stealth'), bonus: stealthBonus() });
  rolls = { results: r.results };
  if (r.ok) { setF('cart_marked'); return { rolls, t: how === 'kestrel' ? `Kestrel slips down to the road while they talk, scores a notch in the wheel rim, and is back in the dark before anyone turns.` : how === 'teodor' ? `The blessed coin lands soundlessly in the straw of the cart bed. Later, a whispered prayer will make it glow faintly, wherever it is.` : `The rag goes into the feed sack, and {Name} is back in the dark before the lantern swings round.` }; }
  if (raiseSusp(r.by <= -5 ? 3 : 1)) return { rolls, ...toCombat('Something gives you away.', false) };
  return { rolls, t: `The mark isn't placed, and somebody on the cart is now paying closer attention.` };
}
function buildGuest(id) { const s = buildSidekick(id); s.level = G.hero.level; return s; }
function fordStow() {
  const r = runCheck({ skill: 'stealth', dc: fordDC(15, 'stealth'), adv: isSpecies('halfling') || heroIs('nyssa'), bonus: stealthBonus() });
  if (r.ok) { G.tmp.fordOutcome = 'ford_stowaway'; return { rolls: r, t: `{Name} slides under the canvas beside the sacking-wrapped blades as the cart turns for home.`, go: 'ford_outcome' }; }
  if (r.by > -5) {
    const r2 = runCheck({ skill: 'stealth', dc: 12 });
    const rolls = { results: [...r.results, ...r2.results] };
    if (r2.ok) { G.tmp.fordOutcome = 'ford_stowaway'; return { rolls, t: `The guard hears something and lifts the canvas. {Name} holds {his} breath behind a crate. He grunts and drops it. The cart turns for home with an extra passenger.`, go: 'ford_outcome' }; }
    G.n.susp = 3; return { rolls, ...toCombat('The guard hears something, lifts the canvas, and finds {Name} staring back.', false) };
  }
  G.n.susp = 3; return { rolls: r, ...toCombat('{Name} misjudges the dark and stumbles into the lantern light.', false) };
}
function fordBluff() {
  const dc = heroIs('nyssa') ? (f('nyssa_was_seen') ? 15 : 11) : 13;
  const r = runCheck({ skill: 'deception', dc });
  if (r.ok) { G.tmp.fordOutcome = 'ford_bluffed'; return { rolls: r, t: `{Name} walks out of the dark into the lantern light, hands open. "Low water. The Lantern Man sent me. He wants a word about the quality." Corvin scowls but buys it. "He could've told me himself." He lets {Name} ride along "to see the goods safe home."`, go: 'ford_outcome' }; }
  G.n.susp = 3; return { rolls: r, ...toCombat(`{Name} walks out of the dark into the lantern light, hands open. "Low water. The Lantern Man sent me." Corvin's hand drops to his belt. "Never seen you before in my life."`, false) };
}
function fordTail() {
  const s = runCheck({ skill: 'stealth', dc: fordDC(12, 'stealth'), mode: 'group', bonus: stealthBonus(), adv: () => f('kestrel_ford_guide') });
  const rolls = { results: [...s.results] };
  if (!s.ok && raiseSusp(1)) { return { rolls, ...toCombat('Corvin glances back, sees movement on the road, and whips the horse!', true) }; }
  if (f('cart_marked') || f('kestrel_ford_guide')) { G.tmp.fordOutcome = 'ford_unseen'; return { rolls, t: `Where the road forks in the dark, the trail is easy to keep${f('cart_marked') ? ': the mark shows the way' : ': Kestrel reads the ruts without slowing'}.`, go: 'ford_outcome' }; }
  const v = runCheck({ skill: 'survival', dc: 12, mode: 'best', bonus: G.tmp.vantage === 'hill' ? 2 : 0 });
  rolls.results.push(...v.results);
  if (v.ok) { G.tmp.fordOutcome = 'ford_unseen'; return { rolls, t: `At the fork in the dark, {Name} reads the fresh ruts and stays on the trail.`, go: 'ford_outcome' }; }
  G.tmp.fordOutcome = 'ford_cart_escaped';
  return { rolls, t: `The cart slips away at a fork in the dark. But by first light, the ruts lead to a riverside building with a lantern above the door.`, go: 'ford_outcome' };
}

/* =========================================================
   ACT 2 SCENES — "The Lantern House"
   ========================================================= */
function act2Begin() {
  G.act = 2;
  const st = G.flags.act2_start || 'UNAWARE';
  G.n.den_alert = { WARY: 1, ON_ALERT: 2, CAPTIVE: 1 }[st] || 0;
  G.n.rook_trust = 0; G.n.clock = 0; G.n.lev = 0;
  if (!['INSIDE_UNAWARE', 'CAPTIVE', 'INSIDE_TRUSTED'].includes(st)) longRest();
  if (st === 'INSIDE_UNAWARE') G.sidekicks.forEach(s => { if (s.inParty && s.alive) s.away = true; });
  if (st === 'INSIDE_TRUSTED') G.sidekicks.forEach(s => { if (s.inParty && s.alive) s.away = true; });
  if (st === 'CAPTIVE') G.sidekicks.forEach(s => { if (s.inParty && s.alive && f('hidden_' + s.id)) s.away = true; });
  log('Act 2: The Lantern House.', 'round');
  return { UNAWARE: 'lh_arrival', WARY: 'lh_arrival', ON_ALERT: 'lh_arrival', INSIDE_UNAWARE: 'lh_stowaway', INSIDE_TRUSTED: 'lh_trusted', CAPTIVE: 'lh_captive' }[st];
}
// The Grey One arrives once, the first time the party lingers in the taproom or parley.
function greyCheck(go) {
  if (!f('grey_done')) { setF('grey_done'); G.tmp.greyFrom = go; return 'lh_grey_arrives'; }
  return go;
}
function escortOn() { return f('rook_escort') && !rookResolved(); }
function rookResolved() { return ['rook_dealt', 'rook_dead', 'rook_fled', 'rook_jailed', 'rook_contact'].some(f); }
function useLev() { if (num('lev') > 0) { G.n.lev--; return true; } return false; }
function prisonerId() {
  const b = skObj('brynja'), k = skObj('kestrel');
  if (!(b && b.inParty) && !(b && !b.alive)) return 'brynja';
  if (!(k && k.inParty) && !(k && !k.alive)) return 'kestrel';
  return null;
}
const pris = id => prisonerId() === id;
function parleyDC(base) { return base + (f('rook_suspicious') && !f('parley_success') ? 2 : 0); }
function patrolActive() { return ['lh_cellar', 'lh_counting_room'].includes(G.scene) && !escortOn() && !f('cellar_clear'); }
function patrolTick(ch) {
  if (!patrolActive()) return null;
  const n = ch.clock !== undefined ? ch.clock : (ch.go ? 0 : 1);
  if (!n) return null;
  G.n.clock = num('clock') + n;
  const max = f('knows_layout') ? 5 : 4;
  if (num('clock') < max) return null;
  const r = runCheck({ skill: 'stealth', dc: 12 + (alert() >= 1 ? 2 : 0), mode: 'group' });
  if (r.ok) { G.n.clock = 2; return { rolls: r.results, t: '*A guard\u2019s lantern swings down the aisle. The party freezes in the shadow of the crates. The light slides over them, and moves on.*' }; }
  return { rolls: r.results, t: '*A lantern swings around the end of the row, straight into your faces. "Who\u2019s there?"*', go: 'combat:cellar' };
}
function companionDistraction() {
  const s = party().find(u => u.kind === 'sidekick');
  if (!s) return null;
  return {
    tamsin: 'Tamsin picks a loud quarrel with a bargeman about the price of grain, and half the room turns to watch.',

}

      fail: { t: `He feels the tug. "Wrong pocket, friend." He doesn't call the guards, but word will get around.`, do: () => { alertUp(1); setF('door_fail'); } } },
    { k: 'back', label: 'Back to the room', once: false, go: 'lh_taproom' }
  ]
},
lh_rook_parley: {
  title: 'Rook\u2019s table',
  enter: () => setF('met_rook'),
  text: [
`Rook pours two cups of something dark and pushes one across. It smells of blackberries and turpentine. Up close, his eyes are small, clever, and very sober.`,
{ if: () => f('nyssa_exposed'), t: `"Little Quill." He shakes his head fondly. "You ran off with a very good view of my business. That makes people nervous. It makes *me* nervous, and I'm a calm man."` },
{ if: () => f('rook_impressed') && !f('nyssa_exposed'), t: `"A pleasure to lose to someone with real talent. What brings talent to my little house?"` },
{ if: () => f('caught_cheating'), t: `"You cheat badly," he says, "but bravely. I value bravery. Briefly. Talk."` },
{ if: () => f('posed_as_buyer') && !f('nyssa_exposed'), t: `"Low water, you said." He swirls his cup. "Strange. I don't remember inviting anyone."` },
{ if: () => f('rook_suspicious') && !f('parley_success'), t: `*Rook is suspicious. Checks here are harder until you win him over.*` }],
  choices: [
    { k: 'buy', label: '"I\u2019m here to buy black blades."',
      check: { skill: 'deception', dc: () => parleyDC((f('posed_as_buyer') && f('knows_password')) || heroIs('nyssa') ? 11 : 13) },
      ok: { t: `"Hm." He studies {Name}. "You're not the first to ask this month. You're the first who isn't grey." He decides. "I have three left. You'll want to see them before you insult me with a price. Hask, the lantern."`,
        do: () => { setF('parley_success'); if (f('grey_done')) setF('rook_escort'); else setF('escort_pending'); }, go: () => greyCheck('lh_cellar') },
      fail: { t: `"No," he says gently, "you're not." He leans back. "So what are you?"`, do: () => alertUp(1), go: () => greyCheck(null) } },
    { k: 'grey', label: '"Who\u2019s the grey buyer?"', t: `He goes still for just a moment. Then: "A customer. Customers like discretion. So do I."`, do: () => setF('asked_grey'), go: () => greyCheck(null) },
    { k: 'read', label: 'Read his reaction', if: () => f('asked_grey'),
      check: { skill: 'insight', dc: () => parleyDC(13) },
      ok: { t: `He's afraid of her. Not of the watch, or of orcs. Of her.`, do: () => setF('rook_fears_grey', 'parley_success') },
      fail: { t: `His face is a pleasant, well-fed wall.` } },
    { k: 'nyssa', label: '"I\u2019m not here to cause trouble. I want to know what I was carrying."', tag: 'Nyssa', if: () => heroIs('nyssa'),
      check: { skill: 'persuasion', dc: () => parleyDC(f('mags_ally') ? 11 : 13) },
      ok: { t: `Rook regards {him} for a long moment. "Orc-loot. Dwarf-made. Older than the river. The orcs dig it out of somewhere in the hills and trade it for silver, and I sell it to people who pay in stranger coin than silver." He shrugs. "I don't ask where. Asking where is how men end up in rivers."`, do: () => setF('rook_admits_trade', 'parley_success'), go: () => greyCheck(null) },
      fail: { t: `"You were carrying my business, Quill. That's all you need to know."`, go: () => greyCheck(null) } },
    { k: 'threat', label: '"The watch knows about you, Rook."',
      check: { skill: 'intimidation', dc: () => parleyDC(f('kuln_knows_smugglers') ? 13 : 15), adv: () => f('has_ledger') || f('rook_fears_grey') },
      ok: { t: `For the first time, the smile slips. "Then let's not keep them waiting on my account." He stands. "Hask. Let's show our guests the cellar, where it's quiet."`,
        do: () => { setF('parley_success', 'rook_cornered'); if (f('grey_done')) setF('rook_escort'); else setF('escort_pending'); }, go: () => greyCheck('lh_cellar') },
      fail: { t: `He laughs. "The watch knows about everyone. That's what the watch is for." He signals Hask, and the conversation is over.`, do: () => { alertUp(1); setF('rook_done_talking'); }, go: () => greyCheck('lh_taproom') } },
    { k: 'leave', label: 'Excuse yourself', go: () => greyCheck('lh_taproom') }
  ]
},

/* ---------------- THE GREY ONE ---------------- */
lh_grey_arrives: {
  title: 'A cold draft',
  text: [
`The door to the dock opens without a sound, and the noise in the taproom drops, just a little, as if a cold draft had come in with whoever opened it.`,
`A hooded figure crosses the room. Short and broad, wrapped in a gray cloak, moving without hurry. Where the hood falls open at the throat, the skin is the color of ash. The figure doesn't look at anyone. It goes straight to the cellar door, which the barkeep unlocks without being asked.`,
{ if: () => f('met_rook'), t: `Rook is on his feet at once. "Forgive me. Business." He follows the hooded figure below, and Hask goes with him.` },
{ if: () => !f('met_rook'), t: `At the back table, Rook is on his feet at once. He follows the hooded figure below, and Hask goes with him.` },
{ if: () => sk('brynja'), t: `Brynja has gone white. She grips {Name}'s sleeve. "That's a duergar," she whispers. "A gray dwarf. From the deep places. What is one of *them* doing *here*?"` }],
  choices: [
    { k: 'follow', label: 'Follow them down. The cellar door is unlocked and unwatched.', do: () => { delete G.flags.escort_pending; setF('grey_in_cellar', 'trapdoor_open'); }, go: 'lh_cellar' },
    { k: 'wait', label: 'Wait and see what she leaves with', go: 'lh_grey_leaves' },
    { k: 'use', label: 'Use the distraction while every eye is on the cellar door', if: () => !f('escort_pending'), t: `Nobody in the taproom is watching anything else. For the next few minutes, slipping, lifting, and picking will be easier.`, do: () => setF('grey_distraction'), go: 'lh_taproom' }
  ]
},
lh_grey_leaves: {
  title: 'The Grey One',
  text: [`Minutes pass. Then the hooded figure comes back up the cellar stairs, a long sacking bundle under one arm. Rook follows, all smiles and bows. The figure leaves by the dock door without a word.`],
  choices: [
    { k: 'follow', label: 'Follow her out onto the dock',
      check: { skill: 'stealth', dc: 14 },
      ok: { t: `{Name} reaches the dock door in time to see her standing at the end of the boards, alone, the bundle under her arm. She lifts her head, as if scenting the air. "Smoke and steel," she says to no one, in a voice like grinding stone. "Someone carries one of ours." Then she is simply gone, the boards creaking under feet that aren't there anymore. Something small and bright rolls to a stop where she stood.`, do: () => setF('grey_followed'), go: 'lh_grey_coin' },
      fail: { t: `She turns at the door and looks straight at {Name}, eyes like banked coals under the hood. Then she steps outside and is gone. When {Name} reaches the dock, there's no one there. Only a coin on the boards, as if dropped for {him} to find.`, do: () => setF('grey_saw_hero'), go: 'lh_grey_coin' } },
    { k: 'resume', label: 'Let her go. Rook is coming back to the table.', if: () => f('escort_pending'),
      t: `Rook settles back into his chair with a sigh, as if he's set down something heavy. "My apologies. Now. Where were we? Ah, yes. The cellar."`, do: () => { delete G.flags.escort_pending; setF('rook_escort'); }, go: 'lh_cellar' },
    { k: 'down', label: 'Let her go, and go downstairs while Rook is busy seeing her out', if: () => !f('escort_pending'), do: () => setF('rook_upstairs'), go: 'lh_cellar' }
  ]
},
lh_grey_coin: {
  title: 'An old coin',
  enter: () => { if (!hasItem('coin')) { addItem('coin'); setF('grey_coin'); log('Found an ancient dwarven coin.', 'good'); } },
  text: [
`The coin is heavy for its size, dark gold gone almost brown with age. One face shows a hammer over an anvil. The other is worn nearly smooth, but around the edge runs a ring of angular runes. It smells faintly of forge smoke.`,
{ if: () => sk('brynja'), t: `Brynja turns it over in her ink-stained fingers. "Dwarven. Old. A hold mint, and that hold..." She stops. "That hold doesn't exist anymore. Nobody's struck a coin like this in a hundred years." She closes her hand around it. "Master Orsik needs to see this."` },
{ if: () => !sk('brynja') && isSpecies('dwarf'), t: `{Name} knows the style, if not the hold: this is dwarven mint-work from a hold that fell a long time ago.` },
{ if: () => !sk('brynja') && !isSpecies('dwarf'), t: `It's dwarven, almost certainly, and very old. Orsik will know more.` }],
  choices: [{ k: 'go', label: 'Continue', go: () => (f('escort_pending') ? (delete G.flags.escort_pending, setF('rook_escort'), 'lh_cellar') : (G.tmp.greyFrom || 'lh_taproom')) }]
},
lh_grey_glimpse: {
  title: 'A figure in the dark',
  enter: () => { setF('grey_done', 'grey_saw_hero'); if (!hasItem('coin')) { addItem('coin'); setF('grey_coin'); } },
  text: [
`Before they reach the light, a figure steps out of a side passage ahead: short and broad, wrapped in a gray cloak, a long sacking bundle under one arm. Where the hood falls open at the throat, the skin is the color of ash.`,
`It stops. Its head turns slowly toward the party in the dark, as if scenting the air. "Smoke and steel," it says, in a voice like grinding stone. "Someone carries one of ours." Then it is simply gone, and quick, light footsteps fade away toward the river.`,
`Where it stood lies a coin: heavy, dark gold gone almost brown, a hammer over an anvil on one face.`,
{ if: () => sk('brynja'), t: `"Duergar," Brynja breathes. "A gray dwarf. They can go invisible." She picks up the coin with shaking fingers. "And this is from a hold that hasn't existed in a hundred years."` }],
  choices: [{ k: 'go', label: 'Follow the voice ahead', go: 'lh_cells' }]
},

/* ---------------- CELLAR ---------------- */
lh_cellar: {
  title: 'The cellar',
  patrol: true,
  leave: () => { if (f('grey_in_cellar') && !f('grey_deal_seen')) setF('grey_deal_seen', 'grey_missed'); },
  enter: () => {
    if (!f('grey_done') && !escortOn()) setF('grey_done', 'grey_in_cellar', 'trapdoor_open');
    if (f('rook_upstairs_soon')) { setF('trapdoor_open'); }
  },
  text: [
`The cellar runs the length of the building, cold and close, smelling of tar, damp sacking, and mice. Water drips somewhere in the dark. Crates stand stacked to the beams, with barrels, coils of rope, and bales wrapped in oilcloth between them. Lanterns hang at intervals, turned low. At the far end, a door stands half-open on a small room lit by a single candle: a desk, ledgers, a strongbox. In the middle of the floor, set into the stone, is a heavy trapdoor with an iron ring and a padlock.`,
{ if: () => escortOn(), t: `Rook walks ahead with a lantern, talking easily about freight and tariffs, as if this were a social call. Hask walks behind.` },
{ if: () => f('grey_in_cellar') && !f('grey_deal_seen') && !escortOn(), t: `Voices from the far end: Rook's, low and deferential, and another that sounds like stones grinding together. The padlock on the trapdoor hangs open.` },
{ if: () => f('cellar_guard_coming') && !f('cellar_clear') && !escortOn(), t: `A lantern is coming down the aisle toward the noise {Name} made.` },
{ if: () => !escortOn() && !f('cellar_clear') && !f('cellar_guard_coming'), t: `Two lanterns move between the crates: guards on rounds, slow and bored.` },
{ if: () => f('trapdoor_open') && !escortOn(), t: `The trapdoor stands open on a stair going down into the dark.` },
{ if: () => patrolActive(), t: () => `*Patrol: ${'●'.repeat(Math.min(num('clock'), f('knows_layout') ? 5 : 4))}${'○'.repeat(Math.max(0, (f('knows_layout') ? 5 : 4) - num('clock')))}. Each thing you do down here gives the guards a chance to come around the crates.*` }],
  choices: [
    { k: 'count', label: 'Search the counting room', if: () => !escortOn(), once: false, clock: 0, go: 'lh_counting_room' },
    { k: 'ambush', label: 'Ambush the guards one at a time', if: () => !escortOn() && !f('cellar_clear'), once: false,
      check: { skill: 'stealth', dc: 13 },
      ok: { t: () => (f('one_guard_down') ? `The second guard turns the corner into a hand over his mouth and a blow to the head. The cellar is quiet.` : `The first guard goes down without a sound, dragged between two crates.`), do: () => { if (f('one_guard_down')) { setF('cellar_clear'); } else { setF('one_guard_down'); G.n.clock = 0; } } },
      fail: { t: `He's quicker than he looks. "Help! Down here!"`, go: 'combat:cellar' } },
    { k: 'bribe', label: 'Bribe the guards to take a long break (10 gp)', if: () => !escortOn() && !f('cellar_clear') && alert() < 2 && G.gold >= 10,
      check: { skill: 'persuasion', dc: 13 },
      ok: { t: `Ten gold buys a lot of ale. The guards decide they've earned a long break upstairs.`, do: () => { G.gold -= 10; setF('cellar_clear'); } },
      fail: { t: `"Rook pays better than that, friend. Now get out before he hears about it."`, do: () => alertUp(1) } },
    { k: 'listen', label: 'Creep close and listen to the voices', if: () => f('grey_in_cellar') && !f('grey_deal_seen') && !escortOn() && !rookResolved(), go: 'lh_grey_deal' },
    { k: 'trap_open', label: 'Go down the open trapdoor', if: () => !escortOn() && f('trapdoor_open') && (f('grey_deal_seen') || !f('grey_in_cellar')), go: 'lh_caves_stair' },
    { k: 'trap_key', label: 'Unlock the trapdoor with the brass key', if: () => !escortOn() && !f('trapdoor_open') && f('has_trapdoor_key'), do: () => setF('trapdoor_open'), go: 'lh_caves_stair' },
    { k: 'trap_pick', label: 'Pick the trapdoor padlock', if: () => !escortOn() && !f('trapdoor_open') && !f('has_trapdoor_key'), once: false,
      check: { skill: 'tools', dc: 13 },
      ok: { t: `The padlock snaps open.`, do: () => setF('trapdoor_open'), go: 'lh_caves_stair' },
      fail: { t: `The padlock holds, and the picks scrape loudly against the iron.` } },
    { k: 'trap_break', label: 'Break the padlock (loud)', if: () => !escortOn() && !f('trapdoor_open') && !f('has_trapdoor_key'), once: false, clock: 2,
      check: { skill: 'athletics', dc: 15 },
      ok: { t: `The hasp tears out of the old wood with a crack that echoes through the cellar.`, do: () => setF('trapdoor_open'), go: 'lh_caves_stair' },
      fail: { t: `The padlock clanks and holds.` } },
    { k: 'see', label: '"Let\u2019s see the blades."', if: () => escortOn() && !rookResolved(), go: 'lh_rook_below' },
    { k: 'slip', label: 'Look for a chance to slip away from Rook and Hask', if: () => escortOn() && !f('slip_tried') && !rookResolved(),
      check: { skill: 'stealth', dc: 15, dis: true },
      ok: { t: `A stack of crates, a turned back, and {Name} has a minute alone in the counting room.`, do: () => setF('slip_tried'), go: 'lh_counting_room' },
      fail: { t: `Rook's lantern swings round. The smile goes. "Now, that's not friendly."`, do: () => setF('slip_tried', 'rook_cornered'), go: 'lh_rook_below' } },
    { k: 'up', label: 'Go back up to the taproom', if: () => !escortOn(), once: false, clock: 0, go: 'lh_taproom' }
  ]
},
lh_counting_room: {
  title: 'The counting room',
  patrol: true,
  text: [`Rook's counting room smells of ink and beeswax, and it is neat in a way the rest of the house is not: ledgers squared on the desk, quills trimmed, a strongbox bolted to the floor. A map of the river is pinned to the wall with knives.`],
  choices: [
    { k: 'ledger', label: 'Read the ledgers',
      check: { skill: 'investigation', dc: 12, adv: () => heroIs('nyssa') },
      ok: { t: `It's all here, in neat columns. Shipments from "the hill suppliers" every ten days or so: blades, by count, paid in silver, the price climbing every month. Most go out to private buyers up and down the river, and one entry makes {Name} go still: a *baron's factor*, buying two. But the biggest buyer, by far, is marked with a single symbol, a small gray circle, and paid in "old coin, dwarf-struck, to be melted." Last entry, three days ago: *G.O.: four. Old coin. She asks again where the orcs dig. Told her I don't know. True.* {Name} pockets the ledger.`, do: () => { setF('has_ledger', 'ledger_read'); addItem('ledger'); } },
      fail: { t: `Rook's shorthand is a mess of symbols and numbers. It's clearly important, though. {Name} takes it anyway; someone can read it later.`, do: () => { setF('has_ledger'); addItem('ledger'); } } },
    { k: 'desk', label: 'Search the desk',
      check: { skill: 'investigation', dc: 13 },
      ok: { t: `Under a false bottom in the drawer: a small brass key on a chain, the trapdoor padlock, and a folded note in a cramped hand: *Hill folk want more silver or no more blades. Tell the Grey One the price rises.*`, do: () => setF('has_trapdoor_key') },
      fail: { t: `Pens, wax, a half-eaten pie.` } },
    { k: 'box', label: 'Open the strongbox (loud)', clock: 2,
      check: { skill: ['tools', 'athletics'], dc: 15 },
      ok: { t: `The lid comes up. Inside: forty gold in mixed coin, and a pouch of six more of the ancient dwarven coins.`, do: () => { G.gold += 40; setF('grey_coins_stash'); if (!hasItem('coin')) addItem('coin'); } },
      fail: { t: `It won't budge.` } },
    { k: 'leave', label: 'Back into the cellar', once: false, clock: 0, go: () => (escortOn() ? 'lh_rook_below' : 'lh_cellar') }
  ]
},
lh_grey_deal: {
  title: 'Behind the crates',
  text: [
`Behind a wall of crates, {Name} can see them by Rook's lantern: Rook, Hask, and the hooded stranger, standing at the open trapdoor. Hask brings up a long sacking bundle from below and lays it on a crate. The stranger unwraps it: two black blades, a short sword and a long knife, gleaming like oil in the lantern light.`,
`The stranger runs a gray thumb along the flat of the short sword. "The mark is true," she says. Her voice is like stones grinding. "Where do the orcs dig, Rook?"`,
`"I've told you, I don't know." Rook spreads his hands. "They won't say. They're more afraid of their own big chief than of you or me."`,
`"Then the price stays as it is." A small bag lands on the crate with a heavy, chinking sound. "And you will find out where they dig. Or I will find someone who can."`],
  enter: () => setF('grey_deal_seen'),
  choices: [
    { k: 'watch', label: 'Keep watching',
      check: { skill: 'stealth', dc: 13, mode: 'group' },
      ok: { t: `She wraps the blades and turns to go, and stops. Her head turns slowly toward the crates where the party is hiding. "Smoke and steel," she murmurs. "Someone carries one of ours." Then she walks up the stairs as if she heard nothing. Rook and Hask follow her. The trapdoor stands open.`, do: () => setF('grey_sensed_blade', 'rook_upstairs'), go: 'lh_cellar' },
      fail: { t: `A crate creaks. Hask's head snaps around. "Who's there?"`, go: 'lh_grey_confront' } },
    { k: 'step', label: 'Step out and confront them', go: 'lh_grey_confront' }
  ]
},
lh_grey_confront: {
  title: 'Face to face',
  enter: () => { setF('rook_cornered', 'grey_saw_hero', 'met_rook'); if (!hasItem('coin')) { addItem('coin'); setF('grey_coin'); } },
  text: [
`For a heartbeat, nobody moves.`,
`Then the stranger laughs, a short dry sound. She looks straight at {Name}, past {him} to the black blade at {his} side, and something in her face sharpens. "You," she says. "You've been somewhere you shouldn't." And then she isn't there. The hood, the cloak, the bundle of blades: gone, as if she'd stepped through a door in the air. Footsteps cross the cellar, fast and light, and the stairs creak, and that's all.`,
`On the crate where she stood lies an ancient dwarven coin, dark gold, a hammer over an anvil.`,
`Rook stares at the empty air. Then he turns to {Name}, and the warmth is gone from his face entirely. "Well," he says. "Now you've cost me a customer."`,
{ if: () => sk('brynja'), t: `"Duergar," Brynja breathes. "She went invisible. They can do that."` }],
  choices: [{ k: 'go', label: 'Face Rook', go: 'lh_rook_below' }]
},

/* ---------------- CAVES ---------------- */
lh_caves_stair: {
  title: 'The stair down',
  enter: () => rejoinAll(),
  text: [
`The stair is cut into living rock, slick with damp, and it goes down farther than seems possible. The air turns cold and smells of river water. At the bottom, lamplight: a cave with a table and a brazier, where a man sits with his boots up, whittling. Beyond him, iron bars glint in the dark.`,
{ if: () => alert() >= 2, t: `Two men, not one. Neither is whittling.` },
{ if: () => f('guardroom_clear'), t: `The guardroom below is quiet now.` }],
  choices: [
    { k: 'down', label: 'Go down', if: () => f('guardroom_clear') || f('guard_fooled'), go: 'lh_guardroom' },
    { k: 'creep', label: 'Creep past the guard to the cells', if: () => !f('guardroom_clear') && !f('guard_fooled'),
      check: { skill: 'stealth', dc: 13, mode: 'group' },
      ok: { t: `Shadow to shadow, behind his back, and into the dark beyond.`, do: () => setF('guard_fooled'), go: 'lh_cells' },
      fail: { t: `His knife stops mid-stroke. He looks up.`, go: 'combat:guardroom' } },
    { k: 'take', label: 'Take the guard out quietly (Stealth DC 12, then Athletics DC 12)', if: () => !f('guardroom_clear') && !f('guard_fooled') && alert() < 2, run: () => {
      const a = runCheck({ skill: 'stealth', dc: 12 });
      if (!a.ok) return { rolls: a, t: `A step creaks. He's on his feet with a club before {Name} reaches him.`, go: 'combat:guardroom' };
      const b = runCheck({ skill: 'athletics', dc: 12 });
      const rolls = { results: [...a.results, ...b.results] };
      if (b.ok) { setF('guardroom_clear'); return { rolls, t: `An arm around the throat, a short struggle, and he slumps across the table, out cold.`, go: 'lh_guardroom' }; }
      return { rolls, t: `He twists free with a shout.`, go: 'combat:guardroom' };
    } },
    { k: 'walk', label: 'Walk in like you belong', if: () => !f('guardroom_clear') && !f('guard_fooled'),
      check: { skill: 'deception', dc: () => (f('has_trapdoor_key') ? 11 : 13) },
      ok: { t: () => (f('has_trapdoor_key') ? `{Name} jingles the brass key. "Rook sent me for the vault." He waves {him} past without looking up.` : `He glances up, sees someone who looks like they know where they're going, and goes back to his whittling.`), do: () => setF('guard_fooled'), go: 'lh_guardroom' },
      fail: { t: `"You're not one of ours." He reaches for his club.`, go: 'combat:guardroom' } },
    { k: 'up', label: 'Back up the stair', once: false, go: 'lh_cellar' }
  ]
},
lh_caves_mouth: {
  title: 'The cave mouth',
  enter: () => rejoinAll(),
  text: [
`Past the dead vines, the cave mouth widens into a tunnel lined with old crates and rotting barrels: smugglers' storage from a century of honest dishonesty. It smells of river mud and old rope. Lamplight flickers ahead, and with it, voices. One of them is a woman's, hoarse and furious.`,
{ if: () => pris('brynja'), t: `"...and when my master hears of it, you'll wish you'd been born a fish," the voice says, in a thick dwarven accent.` },
{ if: () => pris('kestrel'), t: `"...and when I get out of here, I'm taking that knife and finding out which end of you is softer," the voice says pleasantly.` }],
  choices: [
    { k: 'follow', label: 'Follow the voice', go: () => (f('grey_done') ? 'lh_cells' : 'lh_grey_glimpse') },
    { k: 'look', label: 'Look around the tunnel first',
      check: { skill: 'investigation', dc: 12 },
      ok: { t: `Behind a stack of barrels, an iron door in the rock, crusted with river damp but with a bright, new lock. Rook's vault.`, do: () => setF('found_vault') },
      fail: { t: `Rot, rope, and rats.` } },
    { k: 'vault', label: 'Go to the iron door', if: () => f('found_vault'), go: 'lh_vault' },
    { k: 'leave', label: 'Leave the den by the river', if: () => f('has_map_fragment'), once: false, go: () => leaveDen() }
  ]
},
lh_guardroom: {
  title: 'The guardroom',
  enter: () => rejoinAll(),
  text: [
`The guardroom is a cave with a table, a brazier giving off more smoke than heat, a rack of clubs, and an iron-bound chest. On a hook by the table hangs a ring of keys.`,
{ if: () => f('guard_fooled') && !f('guardroom_clear'), t: `The guard is still at his table, whittling, paying no attention.` },
{ if: () => f('gear_taken'), t: `The chest is where they put everything: weapons, packs, the black blade wrapped in its sacking.` }],
  choices: [
    { k: 'keys', label: 'Take the cell keys', if: () => !f('has_cell_keys') && (f('guardroom_clear') || f('guard_fooled')), t: `The ring of keys comes off the hook without a sound.`, do: () => setF('has_cell_keys') },
    { k: 'chest', label: 'Open the chest', if: () => !f('chest_open'),
      check: { skill: 'tools', dc: () => (f('guardroom_clear') ? 0 : 12) },
      ok: { t: () => `Clubs, rope, a lantern, and a potion of healing${f('gear_taken') ? `, and all of {Name}'s gear` : ''}.`, do: () => { setF('chest_open'); addItem('potion'); restoreGear(); } },
      fail: { t: `The chest's lock is better than it looks.` } },
    { k: 'cells', label: 'Go to the cells', once: false, go: 'lh_cells' },
    { k: 'vault', label: 'Go to the vault', once: false, go: 'lh_vault' },
    { k: 'up', label: 'Go back up to the cellar', if: () => f('trapdoor_open') || f('has_trapdoor_key'), once: false, go: 'lh_cellar' },
    { k: 'out', label: 'Go out by the cave mouth', once: false, go: 'lh_caves_mouth' }
  ]
},

/* ---------------- CELLS ---------------- */
lh_cells: {
  title: 'The cells',
  text: [
`Three iron-barred alcoves are cut into the back wall of the cave. The straw inside stinks of old damp, and water seeps down the rock in glistening threads.`,
{ if: () => f('prisoner_freed') || !prisonerId(), t: `The cells are empty now.` },
{ if: () => !f('prisoner_freed') && pris('brynja'), t: `In the third cell, sitting on a pile of straw with her knees pulled up and her chin raised, is a young dwarf woman with ink-stained fingers and copper wire in her braids: Brynja, Orsik's apprentice. She has a bruise on her cheek and murder in her eyes. When she sees {Name}, the murder flickers into something that might be relief, though she'd never admit it.\n\n"Oh, *good*," she says. "You. Of course it's you. Get me out of here."` },
{ if: () => !f('prisoner_freed') && pris('kestrel'), t: `In the third cell is the half-elf hunter, Kestrel, with a split lip and both hands tied. When she sees {Name}, she lets out a long breath.\n\n"Well," she says. "This is humiliating."` }],
  choices: [
    { k: 'what', label: '"What happened?"', if: () => !f('prisoner_freed') && prisonerId(),
      t: () => (pris('brynja') ? `"I followed her. The grey one. She came to the river two nights ago, and I knew what she was, a duergar, a gray dwarf from the deep roads, and I knew Master Orsik would never let me near it. So I followed her here." She scowls. "She knew. She walked me right into the lantern-man's arms and then vanished. She was laughing."` : `"Tracked the cart back from the Ford. Got too close. The big one, Hask, moves quieter than he has any right to." She flexes her bound hands. "They've been asking me who I work for. I keep telling them: myself. They don't believe me."`),
      do: () => { if (pris('brynja')) setF('brynja_story'); } },
    { k: 'tipb', label: '"Do you know where Rook keeps his vault?"', if: () => !f('prisoner_freed') && pris('brynja'),
      t: `"Behind the cells. I heard them open it. The lock clicks seven times. Seven-pin lock." She sniffs. "Dwarven pattern, cheap copy."`, do: () => setF('brynja_vault_tip') },
    { k: 'tipk', label: '"Did you see anything useful?"', if: () => !f('prisoner_freed') && pris('kestrel'),
      t: `"The vault's behind me. There's a needle in the lock; I heard Hask swear about it when he opened it, three days ago."`, do: () => setF('kestrel_vault_tip') },
    { k: 'keys', label: 'Open the cell with the keys', if: () => !f('prisoner_freed') && prisonerId() && f('has_cell_keys'), go: 'lh_cells_freed' },
    { k: 'pick', label: 'Pick the cell lock', if: () => !f('prisoner_freed') && prisonerId() && !f('has_cell_keys'), once: false,
      check: { skill: 'tools', dc: 12 },
      ok: { t: `The lock clicks.`, go: 'lh_cells_freed' },
      fail: { t: `The pick slips. Try again.` } },
    { k: 'break', label: 'Wrench the cell door open (loud)', if: () => !f('prisoner_freed') && prisonerId() && !f('has_cell_keys'), once: false,
      check: { skill: 'athletics', dc: 15 },
      ok: { t: `The hinges give with a shriek of tortured iron.`, do: () => alertUp(1), go: 'lh_cells_freed' },
      fail: { t: `The bars rattle but hold. The noise echoes.`, do: () => alertUp(1) } },
    { k: 'guard', label: 'Go back to the guardroom', once: false, go: 'lh_guardroom' },
    { k: 'vault', label: 'Go to the vault behind the cells', once: false, go: 'lh_vault' }
  ]
},
lh_cells_freed: {
  title: 'Free',
  enter: () => setF('prisoner_freed'),
  text: [
{ if: () => pris('brynja') || G.tmp.freed === 'brynja', t: `Brynja steps out, brushes the straw off her skirts with great dignity, and then grabs {Name} in a brief, fierce hug before shoving {him} away. "Don't tell anyone I did that."` },
{ if: () => pris('kestrel') || G.tmp.freed === 'kestrel', t: `Kestrel holds out her bound wrists. Once they're free, she rolls her shoulders and picks up a club from the rack. "My bow's upstairs somewhere. I'll want it back. And a share of whatever's in that vault."` }],
  choices: [
    { k: 'join', label: '"Come with us."', if: () => slotOpen() && prisonerId(),
      t: () => (pris('brynja') ? `"Obviously."` : (f('kestrel_rival') ? `"Fine. Truce. For now."` : `"Thought you'd never ask."`)),
      do: () => { const id = prisonerId(); G.tmp.freed = id; recruit(id, 'defensive'); if (id === 'brynja') loyal('brynja', 1 + (f('brynja_story') ? 1 : 0)); else loyal('kestrel', 1 + (f('kestrel_fair_deal') ? 1 : 0) - (f('kestrel_rival') ? 1 : 0)); setF('freed_' + id); }, go: 'lh_guardroom' },
    { k: 'home', label: '"Get out of here. Go home."', if: () => prisonerId(),
      t: () => (pris('brynja') ? `"And miss the vault?" She hesitates, then sees the look on {Name}'s face. "Fine. I'll be at the workshop. Bring me whatever you find."` : `"Not without my bow." She slips away toward the stair. A while later, a crossbowman upstairs starts shouting about his missing longbow, and then stops shouting.`),
      do: () => { const id = prisonerId(); G.tmp.freed = id; if (!skObj(id)) { const s = buildSidekick(id); s.inParty = false; G.sidekicks.push(s); } setF(id + '_waiting', 'freed_' + id); }, go: 'lh_guardroom' }
  ]
},

/* ---------------- CAPTIVE ---------------- */
lh_captive: {
  title: 'The cells',
  enter: () => { takeGear(); setF('was_captive'); ['fit_used', 'cantrip_used', 'cellmate_used'].forEach(k => delete G.flags[k]); Object.keys(G.used).filter(k => k.startsWith('lh_captive:')).forEach(k => delete G.used[k]); },
  text: [
`{Name} wakes on cold straw with a head that feels split in two. Iron bars. Lamplight. The smell of river water and old rot, and water seeping down the rock in glistening threads. {His} weapons are gone, {his} pack is gone, and the black blade is gone.`,
`In the next cell over, someone is watching {him}.`,
{ if: () => pris('brynja'), t: `"You're awake," says a young dwarf woman with ink-stained fingers and a bruise on her cheek. "Good. I'm Brynja. Orsik's apprentice. We have perhaps an hour before they come back to ask you questions, and I'd rather not be here when they do."` },
{ if: () => pris('kestrel'), t: `"Oh, good, it's you," says Kestrel from the next cell, without much warmth. "Now we can both rot."` },
{ if: () => G.sidekicks.some(s => s.inParty && s.alive && !s.away), t: () => `In the third cell, ${G.sidekicks.filter(s => s.inParty && s.alive && !s.away).map(s => s.name.split(' ')[0]).join(' and ')} ${G.sidekicks.filter(s => s.inParty && s.alive && !s.away).length > 1 ? 'are' : 'is'} slumped against the bars, alive, groggy, and furious.` },
{ if: () => G.sidekicks.some(s => s.away && s.alive), t: `Somewhere outside, a companion is still free. If {Name} can just hold out...` },
{ if: () => f('second_escape_try'), t: `The guards are laughing about the last attempt. They've gotten careless.` },
`A single guard sits at the table in the next cave, polishing a club.`],
  choices: [
    { k: 'braid', label: 'Use the pick hidden in your braid', tag: 'Nyssa', if: () => heroIs('nyssa') && !f('braid_used'), run: () => {
      const a = runCheck({ skill: 'tools', dc: 12, adv: true });
      if (a.ok) return { rolls: a, t: `They never check the braid. The lock clicks.`, go: 'lh_escape' };
      const b = runCheck({ skill: 'tools', dc: 14, adv: f('second_escape_try') });
      setF('braid_used');
      if (b.ok) return { rolls: { results: [...a.results, ...b.results] }, t: `The first pick snaps. The second one works.`, go: 'lh_escape' };
      return { rolls: { results: [...a.results, ...b.results] }, t: `Both picks snap, and the guard looks up at the sound.`, go: 'combat:cell_escape' };
    } },
    { k: 'fit', label: 'Fake a fit to draw the guard close', if: () => !f('fit_used'), run: () => {
      setF('fit_used');
      const a = runCheck({ skill: 'deception', dc: 13, adv: f('second_escape_try') });
      if (!a.ok) return { rolls: a, t: `"Nice try." He doesn't come closer.` };
      const b = runCheck({ skill: ['sleight', 'athletics'], dc: 11 });
      const rolls = { results: [...a.results, ...b.results] };
      if (b.ok) return { rolls, t: `The guard comes to the bars, cursing, and {Name}'s hand closes on the key ring. Or on his collar. Either way, the cell door opens a moment later.`, go: 'lh_escape' };
      return { rolls, t: `The guard comes to the bars, but {Name} fumbles the grab. He jumps back with a curse and a club.`, go: 'combat:cell_escape' };
    } },
    { k: 'cantrip', label: 'Cast a cantrip at the guard when his back is turned', if: () => G.hero.caster && !f('cantrip_used'),
      t: `Spells that need only voice and gesture still work. {Name} waits until his back is turned...`, do: () => setF('cantrip_used'), go: 'combat:cell_escape' },
    { k: 'brynja', label: 'Ask Brynja for help', if: () => pris('brynja') && !f('cellmate_used'),
      check: { skill: ['persuasion', 'deception'], dc: 11, adv: () => f('second_escape_try') },
      ok: { t: `While {Name} keeps the guard talking, Brynja scratches a rune into the lock plate with a sliver of iron from her hair. The lock clicks. "Cheap dwarven copy. I told you."`, go: 'lh_escape' },
      fail: { t: `The guard isn't in a talking mood. Brynja hisses in frustration.`, do: () => setF('cellmate_used') } },
    { k: 'kestrel', label: 'Ask Kestrel for help', if: () => pris('kestrel') && !f('cellmate_used'),
      check: { skill: ['performance', 'deception', 'intimidation'], dc: 11, adv: () => f('second_escape_try') },
      ok: { t: `While {Name} makes a racket, Kestrel slips her ropes, reaches through the bars, and lifts the guard's keys as he stomps past.`, go: 'lh_escape' },
      fail: { t: `The guard tells them both to shut up, and stays well out of reach.`, do: () => setF('cellmate_used') } },
    { k: 'bars', label: 'Break the bars', once: false,
      check: { skill: 'athletics', dc: 16, adv: () => f('second_escape_try') },
      ok: { t: `A rusted bar comes out of the rock with a crack.`, go: 'lh_escape' },
      fail: { t: `The guard hears the grinding and comes running.`, go: 'combat:cell_escape' } },
    { k: 'wait', label: 'Wait', if: () => G.sidekicks.some(s => s.away && s.alive),
      t: () => `Time passes. Then a thump in the next cave, and the guard's chair scrapes. Silence. ${G.tmp.rescuer || 'A friend'} appears at the bars with the key ring. "You look terrible."`,
      do: () => { const s = G.sidekicks.find(x => x.away && x.alive); G.tmp.rescuer = s ? s.name.split(' ')[0] : null; rejoinAll(); setF('guardroom_clear'); }, go: 'lh_escape' }
  ]
},
lh_escape: {
  title: 'Out of the cell',
  enter: () => { rejoinAll(); restoreGear(); setF('chest_open', 'has_cell_keys'); },
  text: [`The cell door swings open. In the guardroom, the iron-bound chest holds everything they took: weapons, packs, and the black blade, still in its sacking. It hums faintly under {Name}'s hand, as if relieved.`],
  choices: [
    { k: 'free', label: 'Free the other prisoner', if: () => !f('prisoner_freed') && prisonerId(), go: 'lh_cells_freed' },
    { k: 'vault', label: 'The vault', once: false, go: 'lh_vault' },
    { k: 'up', label: 'Up the stair, into the cellar', once: false, do: () => setF('trapdoor_open'), go: 'lh_cellar' },
    { k: 'out', label: 'Out by the cave mouth', once: false, go: 'lh_caves_mouth' }
  ]
},

/* ---------------- VAULT ---------------- */
lh_vault: {
  title: 'The vault door',
  text: [`The vault door is iron, set into the rock with old smugglers' bolts, its lock bright and new. Someone has painted a lantern on it in white, like a signature.`,
{ if: () => f('trap_found') && !f('trap_disarmed'), t: `*Inside the keyhole, a needle on a spring waits, its tip dark and tacky.*` }],
  choices: [
    { k: 'key', label: 'Unlock it with Rook\u2019s key', if: () => f('has_vault_key'), go: 'lh_vault_open' },
    { k: 'search', label: 'Search the door for traps',
      check: { skill: ['investigation', 'perception'], dc: 13, adv: () => f('kestrel_vault_tip') || heroIs('nyssa') },
      ok: { t: `Inside the keyhole, the glint of a needle on a spring, its tip dark and tacky.`, do: () => setF('trap_found') },
      fail: { t: `It looks like a lock.` } },
    { k: 'disarm', label: 'Jam the needle trap', if: () => f('trap_found') && !f('trap_disarmed'), run: () => {
      const r = runCheck({ skill: 'tools', dc: 13 });
      if (r.ok) { setF('trap_disarmed'); return { rolls: r, t: `A twist of wire, and the needle is jammed in place.` }; }
      if (r.by <= -5) { return { rolls: r, t: needleHit() }; }
      return { rolls: r, t: `The spring is stiffer than it looks. Not yet.` };
    } },
    { k: 'pick', label: 'Pick the lock', once: false, run: () => {
      let t = '';
      if (!f('trap_disarmed') && !f('needle_fired')) { t = needleHit() + '\n\n'; }
      const r = runCheck({ skill: 'tools', dc: 15, adv: f('brynja_vault_tip') });
      if (f('vault_tries')) alertUp(1);
      setF('vault_tries');
      if (r.ok) return { rolls: r, t: t + `Seven clicks, and the bolt slides back.`, go: 'lh_vault_open' };
      return { rolls: r, t: t + `The lock holds.` };
    } },
    { k: 'break', label: 'Break it open (very loud)', once: false,
      check: { skill: 'athletics', dc: 18 },
      ok: { t: `The hinges tear from the rock with a scream of metal.`, do: () => alertUp(1), go: 'lh_vault_open' },
      fail: { t: `The door booms like a drum and doesn't move.`, do: () => alertUp(1) } },
    { k: 'back', label: 'Leave it for now', once: false, go: 'lh_guardroom' }
  ]
},
lh_vault_open: {
  title: 'Rook\u2019s vault',
  enter: () => { setF('vault_opened', 'has_map_fragment'); if (!hasItem('map')) addItem('map'); },
  text: [
`Rook's vault is small, dry, and very orderly, and it smells of cedar: he's lined the shelves to keep the river damp out. Shelves of strongboxes. A rack of good wine.${''}`,
{ if: () => alert() >= 3, t: `Half the shelves are already bare. Rook's men have been here, carrying strongboxes to the boat.` },
{ if: () => alert() < 3, t: `A sack of silver coins sits on the floor.` },
`On a shelf at the back: two long sacking bundles and a leather tube capped with wax. The bundles hold black blades, a short sword and a long fighting knife, each with the hammer-in-a-ring mark near the hilt.`,
`The tube holds a map. It's old: vellum, not paper, gone the color of tea, and torn ragged down one side. Half a map. Dwarven runes run along its edges. A river is drawn in faded blue ink, and hills, and a road, and on a high crag a small square fort marked with a rune {Name} has seen before: a hammer within a ring. Beyond the fort, a trail leads north and runs off the torn edge into nothing.`,
{ if: () => sk('brynja'), t: `Brynja makes a small noise. "That's a waystation mark. Clan work. And that rune..." She touches the hammer-in-a-ring with one fingertip, as if it might burn. "It's the same mark. The same as the blades."` },
{ if: () => isSpecies('dwarf'), t: `{Name} can read some of the runes: *road*, *river*, *watch*, and a name that might be *Kelvorn*.` }],
  choices: [
    { k: 'all', label: () => (alert() >= 3 ? 'Take the map, the blades, and the potions' : 'Take everything: map, blades, potions, and silver'),
      do: () => { setF('vault_looted'); addItem('vault_blades'); addItem('potion', 2); if (alert() < 3) G.gold += 120; log(`Took the map, two black blades, two potions${alert() < 3 ? ', and 120 gp' : ''}.`, 'good'); }, go: () => afterVault() },
    { k: 'map', label: 'Take the map and the blades, leave the silver', if: () => alert() < 3,
      do: () => { setF('vault_map_only'); addItem('vault_blades'); addItem('potion', 2); }, go: () => afterVault() }
  ]
},

/* ---------------- ROOK ---------------- */
lh_rook_below: {
  title: 'The Lantern Man',
  enter: () => { rejoinAll(); setF('met_rook'); G.n.lev = 0; },
  text: [
{ if: () => f('rook_escort') && !f('rook_cornered'), t: `Rook leads them down the stair with the lantern held high, still talking. "The old smugglers cut these caves before my grandfather's time. You'd be amazed what the river carries if you know how to ask." At the bottom, he turns, and the smile stays, but Hask has moved to block the stair. "Now. I'm a patient man, but I am not a stupid one. Who are you, and who sent you?"` },
{ if: () => f('rook_cornered'), t: `Rook stands with Hask beside him and two of his men behind with crossbows. The smile is gone. "You've been busy," he says. "Burgling my house. Prowling my cellar. Scaring off my best customer." He sighs. "Tell me why I shouldn't just put you in the river."` },
{ if: () => heroIs('nyssa') && f('nyssa_exposed'), t: `"Little Quill," he adds, almost sadly. "I'd hoped you'd stay drowned."` },
{ if: () => num('lev') > 0, t: () => `*Leverage ready: ${num('lev')}. Each gives advantage on one Intimidation or Persuasion check here.*` }],
  choices: [
    { k: 'lev_ledger', label: 'Leverage: "The watch would love these books."', if: () => f('has_ledger'), t: `Rook's eyes go to the ledger in {Name}'s hand, and stay there.`, do: () => addN('lev', 1) },
    { k: 'lev_grey', label: 'Leverage: "The Grey One won\u2019t like hearing you sell to others."', if: () => f('rook_fears_grey') || f('grey_saw_hero'), t: `Something cold crosses Rook's face.`, do: () => addN('lev', 1) },
    { k: 'lev_map', label: 'Leverage: "You don\u2019t even know what this map is, do you?"', if: () => f('has_map_fragment'), t: `Rook's eyes narrow. He doesn't, and he hates that.`, do: () => addN('lev', 1) },
    { k: 'lev_boat', label: 'Leverage: "Your boat\u2019s at the end of the dock. Your silver\u2019s in it."', if: () => f('knows_rook_boat'), t: `For the first time, Rook glances toward the river.`, do: () => addN('lev', 1) },
    { k: 'lev_corvin', label: 'Leverage: "Corvin talks a lot when he\u2019s scared."', if: () => f('corvin_captured'), t: `Rook mutters something unkind about Corvin's mother.`, do: () => addN('lev', 1) },
    { k: 'intim', label: 'Intimidate him into surrendering',
      check: { skill: 'intimidation', dc: 15, adv: () => useLev() },
      ok: { t: `Rook looks at the party for a long moment. Then he raises both hands, rings flashing, and laughs, a little hollowly. "Hask, put that down. These are reasonable people." He sits on a crate. "What do you want?"`, do: () => { setF('rook_threatened'); addN('rook_trust', -1); }, go: 'lh_rook_terms' },
      fail: { t: `"No." He nods to Hask.`, do: () => { G.tmp.rookInitAdv = true; }, go: 'combat:rook' } },
    { k: 'deal', label: 'Offer him a deal',
      check: { skill: 'persuasion', dc: 13, adv: () => useLev() },
      ok: { t: `"Now *that*," Rook says, "is a language I speak." He waves Hask back. "Sit. Talk."`, do: () => addN('rook_trust', 1), go: 'lh_rook_terms' },
      fail: { t: `"You've nothing I want that I can't take."` } },
    { k: 'nyssa', label: '"You owe me, Benedek. Two years. Let me walk out with what I came for."', tag: 'Nyssa', if: () => heroIs('nyssa'),
      check: { skill: 'persuasion', dc: () => (f('mags_ally') ? 10 : 12), adv: () => useLev() },
      ok: { t: `Rook rubs his face. "Mags would never forgive me. Gods." He looks at Hask. "Let them go."`, do: () => { setF('nyssa_appeal'); addN('rook_trust', 2); }, go: 'lh_rook_terms' },
      fail: { t: `"I owe you nothing, Quill. I paid you."` } },
    { k: 'first', label: 'Strike first, while he\u2019s still talking', if: () => f('rook_escort') && !f('rook_cornered'), do: () => { G.tmp.rookSurprise = true; }, go: 'combat:rook' },
    { k: 'fight', label: 'Fight', go: 'combat:rook' }
  ]
},
lh_rook_dock: {
  title: 'The dock',
  enter: () => { rejoinAll(); setF('met_rook'); G.n.lev = 0; },
  text: [`The dock is chaos: men passing strongboxes down into Rook's boat, lanterns swinging, someone cursing the current. Rook stands in the bow with a bag of silver in each hand. He sees {Name} and doesn't even look surprised.`, `"Ah," he says. "Of course. Cast off, Hask."`],
  choices: [
    { k: 'sab', label: 'Let him go. He won\u2019t get far.', if: () => f('rook_boat_sabotaged'),
      t: `The mooring line, half cut, parts with a snap as the boat swings into the current. Rook's boat spins, slams sideways into the dock pilings, and lodges there, rocking. Rook, soaked to the waist, stares at the frayed rope, then at {Name}. "Was that you?" he asks, with something like admiration.`, go: 'lh_rook_terms' },
    { k: 'stop', label: 'Leap for the boat before it casts off',
      check: { skill: 'athletics', dc: 13, adv: () => sk('tamsin') },
      ok: { t: `{Name} lands in the boat with a thump that nearly swamps it.`, do: () => { G.tmp.rookNoFlee = true; }, go: 'combat:rook' },
      fail: { t: `The boat pulls away into the dark. Rook tips his hat.`, do: () => setF('rook_fled'), go: 'lh_after_den' } },
    { k: 'shoot', label: 'Shoot the man at the oars', run: () => {
      const h = G.hero; const atk = h.caster ? spellAtk(h) : Math.max(...h.weapons.map(w => weaponAtk(h, w).bonus));
      const r = d20({ luck: h.luck }); const tot = r.value + atk; const ok = tot >= 12 || r.value === 20;
      const line = `Attack (${h.name}): ${rollStr(r)} ${sgn(atk)} = ${tot} vs AC 12`; log(line, 'roll');
      if (ok) { G.tmp.rookNoFlee = true; return { rolls: { results: [{ line, ok }] }, t: `The oarsman goes over the side, and the boat drifts back against the dock.`, go: 'combat:rook' }; }
      setF('rook_fled'); return { rolls: { results: [{ line, ok }] }, t: `The shot goes wide. The boat slides away into the dark, and Rook tips his hat.`, go: 'lh_after_den' };
    } },

function tlRound(cheat) {
  G.gold -= 5;
  const r = runCheck({ skill: cheat ? 'sleight' : 'insight', dc: 14 });
  let t;
  if (r.ok) { G.n.tl_w = num('tl_w') + 1; G.gold += 10; t = cheat ? `The die you palmed lands just where you want it. Rook raises an eyebrow and pays out.` : `Rook's left thumb taps the cup he's bluffing on. You call it. He laughs and pays out.`; }
  else if (cheat && r.by <= -5) {
    delete G.flags.tl_active; G.n.tl_games = 2;
    setF('rook_suspicious', 'caught_cheating'); alertUp(1);
    return { rolls: r, t: `The palmed die skitters across the table and comes to rest in front of Rook. His smile doesn't move, but Hask's hand lands on {Name}'s shoulder. "Now that," Rook says, "is the most interesting thing to happen all night."`, go: () => greyCheck('lh_rook_parley') };
  } else { G.n.tl_l = num('tl_l') + 1; t = `Rook lifts the high cup with a flourish. "The house thanks you."`; }
  if (num('tl_w') >= 2) {
    delete G.flags.tl_active; setF('rook_impressed'); G.n.tl_games = 2;
    return { rolls: r, t: t + `\n\nRook slaps the table. "I like you. Nobody beats me at my own game twice in an evening, so you'll forgive me for wanting to know who you are."`, go: () => greyCheck('lh_rook_parley') };
  }
  if (num('tl_l') >= 2) {
    delete G.flags.tl_active; G.n.tl_games = num('tl_games') + 1;
    return { rolls: r, t: t + `\n\n"Better luck next time, friend."`, go: () => greyCheck('lh_taproom') };
  }
  return { rolls: r, t };
}
function needleHit() {
  setF('needle_fired');
  const u = G.hero; const sv = d20({ luck: u.luck }).value + saveBonus(u, 'con');
  const d = rollDie('2d4').total;
  if (sv >= 11) { const h = Math.floor(d / 2); u.hp = Math.max(1, u.hp - h); log(`Poison needle! Con save ${sv} vs DC 11: success, ${h} damage.`, 'roll'); return `A needle snaps out of the keyhole and pricks {Name}'s finger. {He} shakes off the worst of the poison (Con save ${sv}), taking ${h} damage.`; }
  u.hp = Math.max(1, u.hp - d); setF('hero_poisoned'); log(`Poison needle! Con save ${sv} vs DC 11: failure, ${d} damage and poisoned.`, 'bad');
  return `A needle snaps out of the keyhole and pricks {Name}'s finger. The poison burns up {his} arm (Con save ${sv}): ${d} damage, and {he} feels sick and clumsy for the next hour.`;
}

function reactDeal() { loyal('tamsin', -1); loyal('kestrel', 1); loyal('pell', 1); }

  const ok = {

    boots: () => true,
    amulet: u => (u.kind === 'hero' ? u.cls === 'Cleric' : u.id === 'pell'),
    wand: u => !!u.caster,
    finetools: u => u.kind === 'hero' && u.cls === 'Rogue'
  }[item];
  party().forEach(u => { if (ok(u)) out.push(u); });

  if (item === 'wand') u.warwand = true;

  addItem(item);
  setF('vault_reward_taken', 'vault_reward_' + item); G.flags.reward_holder = u.uid;

  log(`${u.name} takes the ${ITEMS[item].name}.`, 'good');
}
