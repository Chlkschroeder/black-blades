  title: 'The road north',
  text: [
`Two days north of Blasingdell, the farms give way to sheep, and the sheep give way to nothing at all: bracken, gorse, and wind. The road dwindles to a cart track, then to a path, then to a line of old stones half sunk in the heather, each one carved with a worn hammer-in-a-ring. Somebody built this road to last.`,
`On the second evening, the crag rises out of the hills ahead, black against a bruised sky, and on top of it, the broken teeth of a fort.`,
{ if: () => f('rook_warned'), t: `Rook's note is still in {Name}'s pocket: *Hill folk are moving toward an old fort north of you. Lots of them. Watch your back.* {He} finds {himself} watching the ridgelines.` },
{ if: () => sk('kestrel'), t: `Kestrel stops, crouches, and touches the path. "Boots. Heavy ones. A lot of them, and not long ago."` },
{ if: () => sk('brynja'), t: `Brynja hasn't spoken for an hour. She's been reading the waystones as they pass, lips moving.` }],
  choices: [
    { k: 'stones', label: 'Ask Brynja what the waystones say', tag: 'Brynja', if: () => sk('brynja'),
      t: `"Distances, mostly. *Watch, two leagues.* And on every one, the clan mark." She runs her thumb over the hammer-in-a-ring. "These are older than Blasingdell. Older than anything in the valley." A pause. "Someone carved a little sun into the corner of the last one. Fresh. Five years old, maybe ten."`, do: () => setF('brynja_waystones') },
    { k: 'on', label: 'Press on to the foot of the crag', go: 'kw_camp' }
  ]
},
kw_camp: {
  title: 'The orc camp',
  enter: () => { if (!f('courana_token')) { setF('courana_token'); if (sk('tamsin')) { loyal('tamsin', 1); setF('tamsin_ribbon'); } else addItem('ribbon'); } },
  text: [
`At the foot of the crag, in a hollow out of the wind, is a camp. Or was. A ring of blackened stones, gnawed bones, a lean-to of cut branches, and the smell of old smoke and older meat. Whoever was here left in a hurry, a few days ago, and they left a lot of tracks going north.`,
`Something blue is caught on a thornbush at the edge of the hollow: a ribbon of blue wool, the kind a girl ties in her hair.`,
{ if: () => sk('tamsin'), t: `Tamsin is across the hollow before anyone else moves. She pulls the ribbon off the thorns and stands there holding it in both hands. "Courana's," she says. Her voice is very steady. "Mother made it. She wears it every day." She looks north, along the trampled path. "She's alive. They brought her through here alive." She ties the ribbon around her own wrist.` },
{ if: () => !sk('tamsin'), t: `{Name} remembers the farm, the young woman fighting every step of the way to the trees. There was a flash of blue in her hair. {He} folds the ribbon carefully and puts it away.` }],
  choices: [
    { k: 'read', label: 'Read the camp',
      check: { skill: 'survival', dc: () => (sk('kestrel') ? 0 : 12), mode: 'best' },
      ok: { t: `Twenty orcs at least, maybe more, with captives, heading north. Not toward the fort: past it. But a smaller group, six or seven, split off and went up toward the Watch, and came back down. Recently.`, do: () => setF('read_camp') },
      fail: { t: `Lots of orcs. Lots of tracks. All of them heading north.` } },
    { k: 'up', label: 'Head up the crag', go: 'kw_approach' }
  ]
},
kw_approach: {
  title: 'Kelvorn\u2019s Watch',
  enter: () => { if ((sk('kestrel') || isSpecies('dwarf')) && !f('kw_ways')) setF('kw_ways'); },
  text: [
`The road climbs the crag in tight switchbacks, the stone paving cracked and heaved by roots. Halfway up, {Name} can see the whole of Kelvorn's Watch above: a square fort of gray stone, its curtain wall broken in two places, a round watchtower at one corner with its top sheared off. The main gate has fallen in, and a slope of rubble fills the gateway. Wind moans through the gaps in the wall like someone blowing across a bottle.`,
`There's a thin thread of smoke rising from somewhere inside. Not a campfire. Something hotter, and steadier: a forge.`,
{ if: () => f('orsik_knows_duergar'), t: `Orsik's warning comes back: *if the gray dwarves know of the Watch, they will be there before you.*` },
{ if: () => f('kw_ways'), t: () => `${sk('kestrel') ? 'Kestrel' : '{Name}'} spots two other ways in at a glance: a culvert grate half buried in nettles at the foot of the wall, and the broken watchtower, its fallen masonry making something like a stair.` }],
  choices: [
    { k: 'gate', label: 'Climb over the rubble in the main gate', once: false, go: 'kw_gate' },
    { k: 'look', label: 'Look for another way in', if: () => !f('kw_ways'),
      check: { skill: ['perception', 'investigation'], dc: 12 },
      ok: { t: `Two. At the foot of the wall, a culvert grate half buried in nettles, where an old cistern drains. And at the watchtower, the masonry has fallen in a way that leaves something like a staircase, if {Name} doesn't mind heights.`, do: () => setF('kw_ways') },
      fail: { t: `Only the gate, as far as {Name} can see.` } },
    { k: 'cistern', label: 'The cistern culvert', if: () => f('kw_ways'), once: false, go: 'kw_cistern' },
    { k: 'tower', label: 'The broken watchtower', if: () => f('kw_ways'), once: false, go: 'kw_tower' }
  ]
},
kw_gate: {
  title: 'The gatehouse',
  text: [
`The rubble in the gateway is loose and treacherous, but climbable. Beyond it is a vaulted gatehouse passage, dim and cold, smelling of wet stone and bat droppings. At its far end stands an inner door: a single slab of dark granite, without hinge or handle, carved all over with runes. In the center, a round hollow the size of a palm, worn smooth by a thousand hands.`,
{ if: () => hasItem('runestone'), t: `Orsik's rune-stone is warm in {Name}'s pocket. It's exactly the size of the hollow.` }],
  choices: [
    { k: 'stone', label: 'Set Orsik\u2019s rune-stone in the hollow', if: () => hasItem('runestone'),
      t: `The stone clicks into place. For a heartbeat, nothing. Then the runes around it light, one after another, a faint gold like embers stirred, and the granite slab grinds aside into the wall. Orsik's clan mark still opens doors.`, do: () => setF('used_runestone'), go: 'kw_courtyard' },
    { k: 'study', label: 'Study the runes', go: 'kw_gate_puzzle' },
    { k: 'back', label: 'Go back and look for another way', once: false, go: 'kw_approach' }
  ]
},
kw_gate_puzzle: {
  title: 'The rune door',
  text: [
`The runes cover the whole door in spiraling bands. Most are decorative: hammers, anvils, knotwork. But a band around the central hollow is different: eight runes, evenly spaced, each set in its own small square that can be pressed. Above the hollow, carved deep, is a phrase in old Dwarvish.`,
`On the wall of the passage beside the door, half-hidden by moss, are carvings of the clan at work: a smith at an anvil, a smith quenching a blade, a smith presenting a sword to a kneeling warrior. Under each picture, a single word.`],
  choices: [
    { k: 'brynja', label: 'Let Brynja read it', tag: 'Brynja', if: () => sk('brynja'),
      t: `Brynja's face lights up like a lamp. "Oh, this is a motto-lock. You press the runes of the clan motto in order." She reads the carving aloud, fingers tracing. "*Forged. Tempered. Given.* That's the motto." She presses three runes. The door grinds open. "Cheap puzzle," she says, very pleased with herself.`, do: () => loyal('brynja', 1), go: 'kw_courtyard' },
    { k: 'dwarf', label: 'Read the motto yourself', tag: 'Dwarf', if: () => isSpecies('dwarf') && !sk('brynja'),
      check: { skill: ['history', 'investigation'], dc: 10, adv: true },
      ok: { t: `The old Dwarvish is stiff and strange, but {Name} puzzles it out: *Our work speaks, in three words.* Forge, temper, give. The door grinds open.`, go: 'kw_courtyard' },
      fail: { t: () => puzzleFail() } },
    { k: 'work', label: 'Work it out from the carvings', once: false,
      check: { skill: 'investigation', dc: () => (f('puzzle_tried') ? 11 : 13) },
      ok: { t: `Three pictures, three words, and the runes on the door match them. The order is the order of the work: forge, temper, give. The door grinds open.`, go: 'kw_courtyard' },
      fail: { t: () => puzzleFail() } },
    { k: 'force', label: 'Force the door', check: { skill: 'athletics', dc: 20 },
      ok: { t: `Impossibly, the slab shifts an inch, then grinds aside. {Name} stares at {his} own hands.`, go: 'kw_courtyard' },
      fail: { t: `It's a slab of granite. Nothing happens, except that the booming carries a long way.`, do: () => setF('kw_noise') } },
    { k: 'back', label: 'Go back', once: false, go: 'kw_approach' }
  ]
},
kw_cistern: {
  title: 'The culvert',
  text: [`The culvert grate is rusted almost through. Behind it, a round tunnel of fitted stone runs back into the crag, ankle-deep in black water that smells of rot and iron. It's tight: Medium folk will have to stoop the whole way.`],
  choices: [
    { k: 'in', label: 'Wrench the grate free and go in', once: false,
      check: { skill: 'athletics', dc: 12, mode: 'best' },
      ok: { t: `The grate comes away with a wet crunch. A long, cold, dripping hundred feet later, the tunnel opens into a cistern: a round chamber with a domed roof, a stagnant pool, and a narrow stair spiraling up. Something pale moves in the water.`, go: 'kw_cistern_pool' },
      fail: { t: `It takes three tries and a lot of grating, screeching iron. A long, cold, dripping hundred feet later, the tunnel opens into a cistern: a domed chamber, a stagnant pool, a narrow stair. Something pale moves in the water.`, do: () => setF('kw_noise'), go: 'kw_cistern_pool' } },
    { k: 'back', label: 'Back', once: false, go: 'kw_approach' }
  ]
},
kw_cistern_pool: {
  title: 'The cistern',
  text: [`It's an eel, as long as a man and as white as a corpse, blind and patient, living on whatever falls in. It hasn't seen a meal this big in years.`],
  choices: [
    { k: 'edge', label: 'Edge around the pool to the stair (each failure means a bite)', run: () => {
      const results = []; const bit = [];
      party().forEach(u => { const x = rollCheck(u, ['acrobatics', 'stealth'], 11); log(x.line + (x.ok ? ' ✓' : ' ✗'), 'roll'); results.push(x);
        if (!x.ok) { const a = d20().value + 4; if (a >= u.ac) { const d = rollDie('1d6').total + 2; u.hp = Math.max(1, u.hp - d); bit.push(`${u.name} is bitten for ${d}`); } else bit.push(`the eel snaps at ${u.name} and misses`); } });
      return { rolls: { results }, t: bit.length ? bit.join('; ') + '. Then everyone is on the stair.' : 'Step by careful step, everyone reaches the stair. The pale shape slides away, disappointed.', go: 'kw_cistern_stair' };
    } },
    { k: 'feed', label: 'Toss it something from your rations',
      t: () => `${sk('kestrel') ? 'Kestrel flicks a dried fish' : 'A strip of jerky goes'} into the water. The eel takes it with a flash of needle teeth and sinks away, satisfied.`, go: 'kw_cistern_stair' }
  ]
},
kw_cistern_stair: {
  title: 'The stair',
  text: [`The stair spirals up through the rock and ends at a wooden trapdoor, swollen and grimy. Light leaks around its edges. Beyond it: wind, birdsong, and, very faintly, the ring of a hammer on metal.`],
  choices: [{ k: 'up', label: 'Push it open', do: () => setF('sentinel_cover'), go: 'kw_courtyard' }]
},
kw_tower: {
  title: 'The broken watchtower',
  text: [`The watchtower's top has sheared off and slid down the crag, leaving the outer wall as a jagged stair of broken masonry, forty feet high. At the top, an open archway leads onto the wall walk. Below, the crag drops away to the road, a long, long way down. The wind here is strong enough to lean on.`],
  choices: [
    { k: 'climb', once: false, label: () => `Climb (Athletics DC ${hasItem('rope') ? 9 : 13} each)`, run: () => {
      const dc = hasItem('rope') ? 9 : 13; const results = []; const hurt = [];
      party().forEach(u => { const x = rollCheck(u, 'athletics', dc); log(x.line + (x.ok ? ' ✓' : ' ✗'), 'roll'); results.push(x); if (!x.ok) { const d = rnd(6); u.hp = Math.max(1, u.hp - d); hurt.push(`${u.name} slips and takes ${d} before a hand grabs ${u.kind === 'hero' ? ({ m: 'his', f: 'her' })[G.hero.gender] : 'their'} wrist`); } });
      return { rolls: { results }, t: (hurt.length ? hurt.join('. ') + '. ' : '') + 'Everyone reaches the wall walk, breathing hard.', go: 'kw_wallwalk' };
    } },
    { k: 'back', label: 'Back', once: false, go: 'kw_approach' }
  ]
},
kw_wallwalk: {
  title: 'The wall walk',
  text: [`The wall walk runs along the top of the curtain wall, crumbling but solid enough. From up here, {Name} can see the whole inside of the Watch: a courtyard of cracked flagstones, a well, a long hall with half its roof gone, and a low stone building against the far wall with smoke rising from its chimney. In the middle of the courtyard, something enormous and gray stands perfectly still, like a statue. Then it turns its head.`],
  choices: [
    { k: 'watch', label: 'Watch it for a while', check: { skill: ['perception', 'investigation'], dc: 11 },
      ok: { t: `It walks a circuit: well, hall door, smoking building, gate, and back, slowly. There's a rune on its back that pulses faintly with each step.`, do: () => setF('sentinel_studied') },
      fail: { t: `It walks. It stops. It walks. That's all {Name} can make of it.` } },
    { k: 'down', label: 'Go down the wall stair into the courtyard', go: 'kw_courtyard' }
  ]
},
kw_courtyard: {
  title: 'The courtyard',
  text: [
`The courtyard of Kelvorn's Watch is quiet in the way that old places are quiet: wind in the broken stones, a crow somewhere, the drip of water. Grass grows between the flagstones. A well stands in the center, capped with a stone lid. On the far side, a long hall with carved doors. Against the east wall, a low stone building with a chimney, and from it, the steady ring of a hammer.`,
`And in the middle of it all, the Sentinel. It's a dwarf, or the shape of one, carved from gray stone and nine feet tall, armored in stone plates and holding a stone hammer the size of a door. Moss grows in the joints of its armor. Its eyes are two chips of dull amber. It walks a slow circuit of the courtyard, step after heavy step, and the flagstones crack under its feet.`,
{ if: () => isSpecies('dwarf'), t: `Something in {Name}'s blood recognizes it. It's waiting to be spoken to.` },
{ if: () => sk('brynja'), t: `Brynja grabs {Name}'s arm. "A ward-guardian. Clan work. It'll know dwarven blood, and the old watchword, if I can remember it..."` }],
  choices: [
    { k: 'dwarf', label: 'Step out and speak to it in Dwarvish', tag: 'Dwarf', if: () => isSpecies('dwarf') && !f('sentinel_hesitated'),
      check: { skill: ['history', 'persuasion'], dc: 12, adv: () => sk('brynja') },
      ok: { t: `The Sentinel stops. The amber eyes turn to {Name}. {He} gives the old clan greeting, the one {he} used at Orsik's door, and the stone hammer lowers. The Sentinel steps aside and goes still.`, do: () => setF('sentinel_obeys'), go: 'kw_inner' },
      fail: { t: `The eyes flare. It takes one step forward, and stops, as if uncertain. One more try.`, do: () => setF('sentinel_hesitated') } },
    { k: 'dwarf2', label: 'Try the greeting once more', tag: 'Dwarf', if: () => f('sentinel_hesitated') && !f('sentinel_obeys'),
      check: { skill: ['history', 'persuasion'], dc: 12, dis: true },
      ok: { t: `This time the words come right. The hammer lowers, and the Sentinel steps aside.`, do: () => setF('sentinel_obeys'), go: 'kw_inner' },
      fail: { t: `The amber eyes blaze.`, go: 'combat:sentinel' } },
    { k: 'brynja', label: 'Let Brynja try the watchword', tag: 'Brynja', if: () => sk('brynja'),
      t: `Brynja walks out into the courtyard with her chin up and her knees shaking. She speaks a single word, then another, then a whole chanted line, and the Sentinel stops in its tracks. It looks at her for a long moment. Then it bows its great stone head.`, do: () => { setF('sentinel_obeys'); loyal('brynja', 1); }, go: 'kw_inner' },
    { k: 'sneak', label: 'Sneak past it',
      check: { skill: 'stealth', dc: 10, mode: 'group', adv: () => f('sentinel_studied') || f('sentinel_cover') },
      ok: { t: `Between one ponderous step and the next, the party crosses the courtyard unseen.`, do: () => setF('sentinel_avoided'), go: 'kw_inner' },
      fail: { t: `The amber eyes swing round.`, go: 'combat:sentinel' } },
    { k: 'rune', label: 'Creep up behind it and smudge the ward-rune', if: () => f('sentinel_studied'), run: () => {
      const a = runCheck({ skill: 'stealth', dc: 12 });
      if (!a.ok) return { rolls: a, t: `A pebble skitters. The Sentinel turns.`, go: 'combat:sentinel' };
      const b = runCheck({ skill: ['arcana', 'athletics'], dc: 13 });
      const rolls = { results: [...a.results, ...b.results] };
      if (b.ok) { setF('sentinel_stopped'); return { rolls, t: `The rune smears under {Name}'s thumb, and the Sentinel freezes mid-stride, one foot raised. It'll stay that way for a while.`, go: 'kw_inner' }; }
      return { rolls, t: `The rune flares under {Name}'s hand, and the Sentinel turns.`, go: 'combat:sentinel' };
    } },
    { k: 'attack', label: 'Attack it', go: 'combat:sentinel' }
  ]
},
kw_dragged: {
  title: 'Outside the walls',
  text: [`{Name} wakes in the rubble outside the gate with grit in {his} mouth and every bone aching. The Sentinel dragged them out, one by one, and left them here. It guards. It doesn't kill. Through the gap in the wall, {he} can see it, back on its rounds.`],
  choices: [{ k: 'go', label: 'Get up', go: 'kw_approach' }]
},
kw_inner: {
  title: 'Inside the Watch',
  text: [
`The courtyard is behind them. Ahead, two choices: the long hall, its carved doors standing half open on darkness, and the low forge building against the east wall, where the hammer rings and the chimney smokes.`,
{ if: () => f('sentinel_obeys'), t: `The Sentinel follows {Name} at a respectful distance, like an enormous, silent dog, until {he} tells it to wait. It waits.` }],
  choices: [
    { k: 'hall', label: 'The Hall of Records', once: false, go: 'kw_hall' },
    { k: 'forge', label: () => (f('forge_done') ? 'The forge-cellar' : 'The forge building'), once: false, go: () => (f('forge_done') ? 'kw_forge_after' : 'kw_forge_approach') }
  ]
},
kw_hall: {
  title: 'The Hall of Records',
  text: [
`The hall is long and high, and half its roof is gone, so that one end is lit by gray daylight and the other is lost in shadow. Birds nest in the rafters. It smells of damp stone, old ink, and bird lime.`,
`The walls are covered with murals, painted on plaster and still bright in places: a great hall under a mountain, full of forges. A smith with a black beard and a hammer, working at an anvil while orcs burn the hall around him. The same smith leading his people through snow. The same smith at a new forge, under a crag shaped like a tooth, making blade after blade after blade. And in the last panel, an army of dwarves with black swords marching out against an army of orcs, the smith at their head, his face twisted with something that isn't quite courage and isn't quite hate.`,
`At the far end, under the open sky, is a stone lectern. On it lies a book.`,
{ if: () => sk('brynja'), t: `Brynja stops in front of the murals and doesn't move for a long time.` }],
  choices: [
    { k: 'murals', label: 'Study the murals', check: { skill: 'history', dc: 12, adv: () => isSpecies('dwarf') || sk('brynja') },
      ok: { t: () => `This is a war-story: a clan driven from its home by orcs, a smith-lord who swore vengeance, a new hold under a crag, and a hundred years of blades forged for one purpose. The crag in the paintings has a single jutting spire, like a tooth.${f('map_mentions_tooth') ? ' *The Tooth.* {Name} feels the pieces start to fit.' : ''}`, do: () => setF('murals_read') },
      fail: { t: `Smiths, orcs, war. Very old, and very angry.` } },
    { k: 'book', label: 'Read the book on the lectern', once: false, go: 'kw_journal' },
    { k: 'search', label: 'Search the hall', once: false, go: 'kw_hall_search' },
    { k: 'leave', label: 'Leave the hall', once: false, go: 'kw_inner' }
  ]
},
kw_journal: {
  title: 'The warden\u2019s journal',
  text: [
`The book is the outpost master's journal: thick vellum pages bound in boards, the ink faded brown. Most of it is the ordinary business of a waystation: shipments in, commissions out, a broken axle, a hard winter. The handwriting is cramped and tidy.`,
`Then, near the end, the hand changes. It gets hurried, then frightened. *Riders from the hold. The siege is in its fourth month. The master sends word that the vault here must be sealed, and the second copy of the road-map kept in it, so that if the hold falls, the clan will still know the way home.* And then: *They are inside. They came under the mountain. The master...*`,
`The last six pages have been cut out with a sharp knife. Recently: the cut edges are clean and white.`],
  choices: [
    { k: 'cut', label: 'Examine the cut', check: { skill: 'investigation', dc: 11 },
      ok: { t: `A very sharp blade, a steady hand, a few days ago at most. Whoever took the pages wanted only the end of the story. And there's a faint dent on the next blank page: the writing on the last page pressed through.`, do: () => setF('journal_impression') },
      fail: { t: `Cut out, cleanly. That's all.` } },
    { k: 'take', label: 'Take the journal', if: () => !hasItem('journal'), t: `It's heavy, and it smells of a century.`, do: () => { addItem('journal'); setF('has_journal'); } },
    { k: 'back', label: 'Back', once: false, go: 'kw_hall' }
  ]
},
kw_hall_search: {
  title: 'The dark end of the hall',
  text: [`Rubble, fallen roof slates, a nest of field mice in an old chest. Along the walls, stone shelves where scrolls once sat, now empty or rotted to dust. And then, at the dark end of the hall, low down on the wall where someone would have to kneel to carve it, a newer inscription, scratched into the plaster with a knife point.`],
  choices: [
    { k: 'read', label: 'Read it', if: () => !f('found_haldar_inscription'),
      t: () => [`It's in Dwarvish, the letters careful and square: *H. Deepmantle passed here, seeking the Tooth. The road holds. Tell my father I found it.* And beside it, small, a carved sun. The date is eleven years ago.`,
        f('brynja_waystones') ? `Brynja goes very still. "That's the same sun," she says. "On the waystone."` : '',
        sk('brynja') ? `"Deepmantle." Brynja's voice is barely a whisper. "Master Orsik had a son. Haldar. Nobody ever talks about him. I thought he'd died young, of a fever, or..." She looks at {Name}. "He came here. He went looking."` : (f('orsik_hint_haldar') ? `*Someone went looking for that smith's hall, years ago. He never came back.* {Name} thinks {he} knows now who Orsik meant.` : '')].filter(Boolean).join('\n\n'),
      do: () => setF('found_haldar_inscription') },
    { k: 'back', label: 'Back', once: false, go: 'kw_hall' }
  ]
},

/* ---------------- THE RIVAL ---------------- */
kw_forge_approach: {
  title: 'The forge building',
  text: [
`The forge building is squat and solid, built into the east wall, its stone roof intact. The door hangs open. Heat rolls out of it, and the orange flicker of a fire, and the smell of hot iron and coal.`,
{ if: () => !f('kw_noise'), t: `The hammer rings, stops, rings again.` },
{ if: () => f('kw_noise'), t: `The hammer isn't ringing. Inside, it's very quiet.` },
`Inside, a stair leads down: the forge-cellar, cut into the crag.`],
  choices: [
    { k: 'creep', label: 'Creep down and look', once: false,
      check: { skill: 'stealth', dc: () => (f('kw_noise') ? 15 : 13), mode: 'group' },
      ok: { t: `Down the stair, step by silent step.`, go: 'kw_forge_watch' },
      fail: { t: `A loose stone turns under a boot.`, go: 'kw_forge_caught' } },
    { k: 'open', label: 'Walk down openly, announcing yourself', go: 'kw_forge_parley' },
    { k: 'back', label: 'Back to the courtyard', once: false, go: 'kw_inner' }
  ]
},
kw_forge_watch: {
  title: 'The forge-cellar',
  text: [
`The forge-cellar is a long, low vault lit by a single roaring hearth. Two duergar, broad and gray-skinned and bald, are working: one at the bellows, one hammering a strip of black metal on the anvil, over and over, scowling at the result. A third figure stands at the far wall, hooded, reading by the firelight from a handful of loose vellum pages. Behind her, set into the back wall, is a round iron door covered in runes, with a hollow in its center the shape of a torn half-map.`,
`It's the Grey One. And the pages in her hands are, unmistakably, the end of the outpost master's journal.`,
`The smith at the anvil throws down his hammer. "It's no good. The metal won't hold the rune. It never holds."`,
`"Then we need the old smith's way," the hooded woman says without looking up. "And the old smith's way is behind that door, or under that mountain." She lifts a page to the light. "Under the Tooth."`,
{ if: () => !(isSpecies('dwarf') || sk('brynja')), t: `They speak Dwarvish, rough and guttural. {Name} doesn't understand the words, but {he} understands *Tooth*, because the Grey One says it in Common, as if she wanted to taste it.` }],
  choices: [
    { k: 'watch', label: 'Keep watching',
      check: { skill: 'stealth', dc: 13, mode: 'group' },
      ok: { t: `They argue about the door. They've tried everything: picks, fire, runes of their own. It won't open without the map. "The orcs had half," the smith says. "We should have bought it with the blades." The Grey One's answer is cold: "The orcs didn't know they had it."`, do: () => setF('overheard_duergar') },
      fail: { t: `A crate creaks.`, go: 'kw_forge_caught' } },
    { k: 'talk', label: 'Step out and talk', go: 'kw_forge_parley' },
    { k: 'attack', label: 'Attack while they\u2019re unaware', do: () => { G.tmp.duergarSurprise = true; gharedSet('ghared_grudge'); }, go: 'combat:duergar' },
    { k: 'leave', label: 'Slip back out and come back later', once: false, go: 'kw_inner' }
  ]
},
kw_forge_caught: {
  title: 'Caught',
  enter: () => setF('forge_caught'),
  text: [
`Instantly, the hammering stops. Two broad gray shapes come around the hearth with war picks raised, and as they move, they *grow*: shoulders swelling, heads brushing the vault, until they're twice the size of a dwarf.`,
`Behind them, the hooded woman doesn't even look up from her pages. "Wait," she says.`,
`They wait.`,
`She looks up. It's the Grey One, the hood back now: an ash-gray dwarf woman with a shaved head, a scar through one eyebrow, and eyes like banked coals.`,
{ if: () => f('grey_saw_hero') || f('grey_sensed_blade') || f('grey_followed'), t: `"You," she says. "Smoke and steel. I wondered when you'd come."` },
{ if: () => !(f('grey_saw_hero') || f('grey_sensed_blade') || f('grey_followed')), t: `Her eyes go to the black blade at {Name}'s hip, and stay there.` }],
  choices: [{ k: 'go', label: 'Face her', go: 'kw_forge_parley' }]
},
kw_forge_parley: {
  title: 'Ghared',
  enter: () => setF('met_ghared'),
  text: [
`The Grey One sets the pages down on the anvil, deliberately, with the flat of her hand over them.`,
`"I'm Ghared," she says. Her Common is careful, with a rasp under it like a file on iron. "I serve the clan Ironhand, under the mountains. You carry a blade that was made by a dead smith, and you followed my trail here." She tilts her head. "You've come for the door. So have I. Neither of us can open it alone. You, because you don't know what you're doing. Me, because I don't have the other half of the map." A thin smile. "Or do you?"`,
{ if: () => f('ghared_forewarned'), t: `"Your friend the Lantern Man sends his regards," she adds. "He sold me your name for twelve coins of old gold. You should choose your friends better."` }],
  choices: [
    { k: 'want', label: '"What do you want with the smith\u2019s work?"', t: `"What everyone wants: what's mine." She shrugs. "The smith made blades that remembered their purpose. That *hated*. My clan has been trying to make a blade like that for a hundred years. We've come close. We've never done it." She looks at the black blade at {Name}'s hip. "That one remembers. I can feel it from here."` },
    { k: 'orcs', label: '"Who are the orcs working for?"', t: `Ghared snorts. "An ogre who calls himself Great. He sits on the smith's front door and sends his orcs out to steal. They dig in the old halls and sell what they find." Her gaze sharpens. "They don't know what they have. That's the only reason I haven't killed them all."` },
    { k: 'read', label: 'Read her', check: { skill: 'insight', dc: () => gharedDC(13) },
      ok: { t: `She's telling the truth, as far as it goes. She's not cruel, just cold, and she keeps her word because breaking it would be untidy. And she's impatient: she's been here a week and she's running out of time.`, do: () => setF('read_ghared') },
      fail: { t: `Her face gives away exactly nothing.` } },
    { k: 'deal', label: 'Offer a deal: "The map opens the door. What\u2019s in the vault, we share."', go: 'kw_ghared_deal' },
    { k: 'lie', label: 'Lie: "I don\u2019t have the map."',
      check: { skill: 'deception', dc: () => gharedDC(f('overheard_duergar') ? 15 : 15), adv: () => f('read_ghared') },
      ok: { t: `Ghared studies {Name}, then shrugs. "Then you're wasting my time, and I'm wasting mine." She gathers her pages and nods to her delvers. "We'll try the hold itself." They turn invisible, all three, and their footsteps go up the stair and away.`, do: () => { setF('ghared_fooled', 'pages_with_ghared', 'forge_done'); }, go: 'kw_forge_after' },
      fail: { t: `"Now that," she says softly, "was a mistake."`, do: () => gharedSet('ghared_grudge'), go: 'combat:duergar' } },
    { k: 'threat', label: '"Get out of here. The door is ours."',
      check: { skill: 'intimidation', dc: () => gharedDC(16), adv: () => f('sentinel_obeys') },
      ok: { t: () => `${f('sentinel_obeys') ? '"My friend upstairs would like a word," {Name} says, and above them, the stone floor shakes under a single heavy step. ' : ''}Ghared laughs, a short dry bark. "You've got nerve, surface-walker." She sets the pages on the anvil. "I've read them. I don't need them. Keep your door. I'll be waiting for you somewhere less comfortable." She and her delvers turn invisible and go.`, do: () => { gharedSet('ghared_respect'); setF('pages_with_party', 'forge_done'); }, go: 'kw_forge_after' },
      fail: { t: `She doesn't even blink. "No."`, do: () => gharedSet('ghared_grudge'), go: 'combat:duergar' } },
    { k: 'attack', label: 'Attack', do: () => gharedSet('ghared_grudge'), go: 'combat:duergar' }
  ]
},
kw_ghared_deal: {
  title: 'Terms',
  text: [`Ghared considers it. The firelight moves on her gray face.`, `"Here are my terms," she says. "You open the door with your map. Inside, the clan will have left a copy of the road and the smith's records. You take the road. I take one thing: the smith's own notes on the forging, if they're there. Everything else is yours." She holds out a hand, gray and scarred. "Swear it on your blade."`],
  choices: [
    { k: 'swear', label: 'Swear it',
      t: () => `She grips {Name}'s hand once, hard, and lets go. Then she pushes the stack of journal pages across the anvil. "A gift, to start."${sk('brynja') ? ' Brynja looks like she\'s been asked to swallow a stone, but she says nothing.' : ''}`,
      do: () => { setF('ghared_deal', 'pages_with_party', 'forge_done'); loyal('brynja', -1); }, go: 'kw_forge_after' },
    { k: 'haggle', label: '"The notes stay with the clan. You get a copy."',
      check: { skill: 'persuasion', dc: () => gharedDC(14), adv: () => f('read_ghared') },
      ok: { t: () => `Ghared's eyes narrow, then something like approval crosses her face. "A copy. Made by ${sk('brynja') ? 'your apprentice' : 'your own hand'}." She nods. "Fine." She pushes the journal pages across the anvil.`, do: () => { setF('ghared_deal', 'ghared_copy_only', 'pages_with_party', 'forge_done'); loyal('brynja', 1); }, go: 'kw_forge_after' },
      fail: { t: `"The notes, or nothing."` } },
    { k: 'refuse', label: 'Refuse',
      t: `"Then we'll see who gets there first." Ghared and her delvers turn invisible and are gone, taking the journal pages with them.`, do: () => setF('ghared_racing', 'pages_with_ghared', 'forge_done'), go: 'kw_forge_after' }
  ]
},
kw_ghared_beaten: {
  title: 'Beaten',
  text: [`Ghared lies on the forge floor with blood on her lip, one hand pressed to her side, glaring up at {Name} with those banked-coal eyes. She's not afraid. She's furious, mostly with herself.`, `"Well," she says. "Finish it, then."`],
  choices: [
    { k: 'spare', label: 'Spare her: "Go. Take your people and go."', t: `She stares. Then she laughs, painfully. "Surface-walkers." She gets to her feet. "I won't forget this." She and her delvers turn invisible and go, leaving the journal pages on the anvil.`, do: () => { gharedSet('ghared_debt'); setF('pages_with_party', 'forge_done'); loyal('pell', 1); }, go: 'kw_forge_after' },
    { k: 'bind', label: 'Take her prisoner', t: `She lets herself be bound, smiling slightly. By morning, the ropes are lying on the floor in a neat coil, and she's gone. The journal pages sit on the anvil, squared neatly, like a courtesy.`, do: () => { gharedSet('ghared_respect'); setF('pages_with_party', 'forge_done'); }, go: 'kw_forge_after' },
    { k: 'kill', label: 'Kill her', t: `It isn't easy, even now. When it's done, the delvers are long gone. The journal pages are in her coat.`, do: () => { ['ghared_debt', 'ghared_respect', 'ghared_grudge'].forEach(x => delete G.flags[x]); setF('ghared_dead', 'pages_with_party', 'forge_done'); loyal('pell', -2); }, go: 'kw_forge_after' }
  ]
},
kw_ghared_note: {
  title: 'A note',
  text: [`{Name} wakes on the forge floor, aching everywhere, with something pinned to {his} sleeve by {his} own dagger: a scrap of vellum, and on it, in neat, square letters: *Next time, I won't be so kind. G.* The duergar are gone, and so are the journal pages.`],
  choices: [{ k: 'go', label: 'Get up', do: () => setF('forge_done'), go: 'kw_forge_after' }]
},
kw_forge_after: {
  title: 'The forge-cellar',
  enter: () => setF('forge_done'),
  text: [
`The forge-cellar is quiet except for the roar of the hearth. On the anvil lies the strip of black metal the duergar smith was working: dull, cracked, a failed blade. Behind it, the round iron door waits, covered in runes, with its hollow the shape of a torn half-map.`,
{ if: () => f('pages_with_party') && !f('pages_read'), t: `The journal pages are here, in {Name}'s hands now.` },
{ if: () => f('pages_with_ghared') && !f('pages_read'), t: `The anvil is bare. Ghared took the pages.` }],
  choices: [
    { k: 'pages', label: 'Read the last pages', if: () => f('pages_with_party') && !f('pages_read'), go: 'kw_pages' },
    { k: 'rub', label: 'Make a charcoal rubbing of the dent on the blank page', if: () => f('pages_with_ghared') && !f('pages_read') && (f('journal_impression') || hasItem('journal')),
      check: { skill: 'investigation', dc: 12, adv: () => sk('brynja') },
      ok: { t: `A stick of charcoal from the forge, rubbed lightly across the blank page, brings up the ghost of the writing beneath.`, do: () => setF('pages_partial'), go: 'kw_pages' },
      fail: { t: `Smudges, mostly. But one word comes up clear, pressed deep, as if the writer leaned hard on it: *Khundrukar*.`, do: () => setF('knows_khundrukar', 'pages_read') } },
    { k: 'journal', label: 'Go back to the hall for the journal', if: () => f('pages_with_ghared') && !f('pages_read') && !hasItem('journal'), go: 'kw_journal' },
    { k: 'door', label: 'Open the iron door with the map', go: 'kw_vault_door' },
    { k: 'out', label: 'Go back up to the courtyard', once: false, go: 'kw_inner' }
  ]
},

/* ---------------- PAGES & VAULT ---------------- */
kw_pages: {
  title: 'Kelvorn\u2019s last pages',
  enter: () => setF('pages_read', 'knows_khundrukar', 'knows_durgeddin', 'knows_stone_tooth'),
  text: [
{ if: () => !f('pages_partial'), t: `The six cut pages are in the same cramped hand as the rest of the journal, but the writing is jagged now, the lines sloping, the ink blotted where the pen pressed too hard.\n\n*The riders say the hold is lost. Khundrukar is lost. The orcs came under the mountain by a tunnel they dug in secret through the winter, and they came in the night, and the gates did not matter.*\n\n*The master is dead. Durgeddin the Black is dead. They say he died at his anvil, with a hammer in his hand, and that he cursed them as he fell.*\n\n*I have sealed the vault as he commanded, with the second copy of the road to the Stone Tooth inside, so that the clan will know the way home. The key is the first copy, which the riders carried. If they are taken, the key is taken.*\n\n*The riders did not come back.*\n\n*I am the last at the Watch. If anyone of Durgeddin's blood reads this, know that his blades are still in the deep vaults under the Tooth, and that the forge is still there, and that the orcs will never understand what they have. Go home. Take it back.*\n\n*Kelvorn, Watch-warden.*` },
{ if: () => f('pages_partial'), t: `The charcoal brings up the ghost of the writing, faint and broken: *...Khundrukar is lost...* *...Durgeddin the Black is dead...* *...the second copy of the road to the Stone Tooth...* *...his blades are still in the deep vaults...* *...go home. Take it back.*\n\nIt's enough.` },
{ if: () => sk('brynja'), t: `Brynja reads it over {Name}'s shoulder, and when she reaches the name *Durgeddin* she sits down, hard, on the edge of the hearth. "Durgeddin the Black," she whispers. "The Smith of Vengeance. They tell stories about him to dwarf children. I thought they were *stories*."` },
{ if: () => !sk('brynja') && isSpecies('dwarf'), t: `{Name} knows the name. Every dwarf does. Durgeddin the Black, who swore a war on orcs that lasted his whole life, whose blades hated what they cut. A tale for long winters. Apparently not only a tale.` }],
  choices: [{ k: 'door', label: 'Open the iron door with the map', go: 'kw_vault_door' }]
},
kw_vault_door: {
  title: 'The iron door',
  text: [
`The iron door is round, as tall as a dwarf, set flush into the rock at the back of the forge-cellar. Its runes all spiral inward to the hollow in its center: a shallow recess with one straight edge and one ragged one, exactly the shape of the torn map.`,
`{Name} unrolls the map fragment and lays it in the hollow. It fits like a key in a lock.`,
`For a long moment, nothing happens. Then, slowly, the runes begin to glow, the same ember-gold as the gate, spreading outward from the map in rings. Somewhere inside the rock, something heavy shifts, and the iron door swings inward with a sigh of air that smells of cedar oil and a hundred years of dust.`,
{ if: () => f('ghared_deal'), t: `Ghared steps out of the air beside the door, as if she'd been there the whole time. Maybe she had. "Well," she says. "Shall we?"` },
{ if: () => f('ghared_fooled'), t: `Ghared appears beside the door, amused. "Liar. I like you better already." She inclines her head. "The notes, then. Or shall we fight over them?"` }],
  enter: () => { if (f('ghared_fooled') && !f('fooled_resolved')) { setF('fooled_resolved', 'ghared_asks'); gharedSet('ghared_respect'); } },
  choices: [
    { k: 'in', label: 'Step inside', if: () => !f('ghared_racing'), go: 'kw_vault' },
    { k: 'race', label: 'Step inside', if: () => f('ghared_racing'), go: 'kw_ghared_snatch' }
  ]
},
kw_ghared_snatch: {
  title: 'A draft',
  text: [`The door is barely open when {Name} feels it: a draft where there shouldn't be one, a faint smell of forge smoke, the softest scuff of a boot on stone right beside {him}.`],
  choices: [
    { k: 'grab', label: 'Grab at the empty air', run: () => {
      const a = runCheck({ skill: 'perception', dc: 15, adv: sk('kestrel') || f('sentinel_obeys') });
      const b = a.ok ? runCheck({ skill: 'athletics', dc: 13 }) : null;
      const rolls = { results: [...a.results, ...(b ? b.results : [])] };
      delete G.flags.ghared_racing; gharedSet('ghared_respect');
      if (a.ok && b.ok) { setF('ghared_asks'); return { rolls, t: `{Name}'s hand closes on a wrist. Ghared shimmers into view, caught, and for a moment she just looks at {his} hand on her arm. Then she grins. "Fast," she says. "Fine. You win this one." She steps back, hands open. "A copy of the notes, then. If you'd be so kind."`, go: 'kw_vault' }; }
      setF('notes_stolen'); return { rolls, t: `Nothing there. Then the draft is gone, and so is she.`, go: 'kw_vault' };
    } },
    { k: 'let', label: 'Let her go. Whatever she wants, it isn\u2019t worth a fight in the dark.', do: () => { delete G.flags.ghared_racing; gharedSet('ghared_respect'); setF('notes_stolen'); }, go: 'kw_vault' }
  ]
},
kw_vault: {
  title: 'The clan vault',
  enter: () => { if (!hasItem('full_map')) { addItem('full_map'); setF('has_full_map'); useItem('map'); } },
  text: [
`The vault is a round stone chamber, dry as a bone, lined with cedar shelves that still smell faintly sweet. A dwarf could stand upright in it; a human has to stoop. Everything in it was put here with care, a hundred years ago, by someone who expected to come back.`,
`On a reading-stand in the center lies a rolled map in a leather case: the second copy of the road. Unrolled, it shows the whole of it: the river, the valley, Kelvorn's Watch on its crag, and the road running north three days into wild hills, to a forested crag with a single stone spire rising from it, sharp as a fang. Beneath the spire, in careful dwarven runes: *Khundrukar.* And smaller: *the Stone Tooth.*`,
`On the shelves around it: a bundle of vellum notebooks tied with wire, stamped with a hammer-in-a-ring. And a row of finished pieces, wrapped in oiled cloth, each with a commission tag: work the clan made for allies and never delivered.`,
{ if: () => f('notes_stolen'), t: `One shelf is empty. A clean rectangle in the dust shows where a bundle of notebooks lay until a few minutes ago.` },
{ if: () => (f('ghared_deal') || f('ghared_asks')) && !f('notes_decided'), t: `Ghared stands in the doorway, watching the notebooks. She doesn't touch them. She's waiting to see what {Name} does.` }],
  choices: [
    { k: 'look', label: 'Look at the notebooks', if: () => !f('notes_stolen') && !f('notes_to_ghared'),
      t: () => `They're Durgeddin's own forging notes, or a copy made for safekeeping: pages of runes, temperatures, quenching orders, and diagrams of blades with their edges marked in a script {Name} can't read. On the last page, a single line in a different, bigger, angrier hand: *A blade must be taught what to hate.*${sk('brynja') ? `\n\nBrynja holds them like they're made of glass. "These shouldn't exist," she says. "These are the most important thing I've ever touched."` : ''}` },
    { k: 'decide', label: 'Decide about the notebooks', if: () => !f('notes_stolen') && !f('notes_decided'), go: 'kw_notes_choice' },
    { k: 'reward', label: 'Look at the commissioned pieces', if: () => !f('vault_reward_taken') && (f('notes_decided') || f('notes_stolen')), once: false, go: () => (f('lvl3') ? 'kw_reward' : (G.tmp.afterLevel = 'kw_reward', 'kw_levelup')) },
    { k: 'leave', label: 'Leave the vault', if: () => f('vault_reward_taken'), go: () => (f('lvl3') ? 'kw_warband' : (G.tmp.afterLevel = 'kw_warband', 'kw_levelup')) }
  ]
},
kw_notes_choice: {
  title: 'Durgeddin\u2019s notes',
  text: [
{ if: () => f('ghared_deal') && !f('ghared_copy_only'), t: `"Our bargain," Ghared says quietly. "The notes."` },
{ if: () => f('ghared_deal') && f('ghared_copy_only'), t: `"Our bargain," Ghared says. "A copy."` },
{ if: () => f('ghared_asks'), t: `"I'll ask nicely, once," Ghared says. "A copy. That's all. My clan has been trying for a hundred years."` },
{ if: () => !f('ghared_deal') && !f('ghared_asks'), t: `The notebooks are just there, on the shelf. Nobody else will ever know they were here.` }],
  choices: [
    { k: 'give', label: 'Keep your word: give her the notebooks', if: () => f('ghared_deal') && !f('ghared_copy_only'),
      t: () => `Ghared takes them in both hands, and for the first time her face softens. "You're an honest fool," she says. "My clan will remember the name {Name}." She touches two fingers to her brow, a duergar salute, and is gone.${sk('brynja') ? ' Brynja looks like she\'s going to be sick.' : ''}`,
      do: () => { gharedSet('ghared_debt'); setF('notes_to_ghared', 'notes_decided'); loyal('brynja', -1); }, go: 'kw_vault' },
    { k: 'copy', label: 'Have a copy made, and keep the originals', if: () => f('ghared_copy_only') || f('ghared_asks'),
      t: () => `It takes an hour. ${sk('brynja') ? 'Brynja copies' : '{Name} copies, slowly and badly,'} the key pages onto blank vellum from the shelves while Ghared watches every stroke. When it's done, she takes the copy, checks it, and nods. "Fair."`,
      do: () => { gharedSet(f('ghared_copy_only') ? 'ghared_debt' : 'ghared_respect'); setF('notes_copied', 'has_forge_notes', 'notes_decided'); addItem('forge_notes'); }, go: 'kw_vault' },
    { k: 'break', label: 'Break your word: keep the notebooks', if: () => f('ghared_deal') && !f('ghared_copy_only'),
      t: `"I see," Ghared says. That's all. She doesn't fight. She simply turns invisible, and her last words come out of empty air: "We'll meet under the Tooth, oath-breaker."`,
      do: () => { gharedSet('ghared_grudge'); setF('ghared_oathbroken', 'has_forge_notes', 'notes_decided'); addItem('forge_notes'); loyal('tamsin', -1); loyal('brynja', 1); }, go: 'kw_vault' },
    { k: 'refuse', label: 'Refuse her', if: () => f('ghared_asks'),
      t: `"Then I'll find my own way in." She's gone.`, do: () => { gharedSet('ghared_grudge'); setF('has_forge_notes', 'notes_decided'); addItem('forge_notes'); }, go: 'kw_vault' },
    { k: 'take', label: 'Take the notebooks', if: () => !f('ghared_deal') && !f('ghared_asks'),
      t: `They go into {Name}'s pack, wrapped in oilcloth.`, do: () => { setF('has_forge_notes', 'notes_decided'); addItem('forge_notes'); }, go: 'kw_vault' }
  ]
},
kw_levelup: {
  title: 'Level 3',
  enter: () => { if (!f('lvl3')) { setF('lvl3'); G.tmp.lvlLines = levelUp(3); } },
  text: [
`{Name} sits on the vault's cool stone floor with the map across {his} knees, tracing the road to the Stone Tooth with a fingertip. Three days north. Khundrukar. Courana and Geradil. Orsik's son. And whatever made these blades hate.`,
`Something has changed, these last weeks. {Name} can feel it the way a smith feels steel take an edge: the fights {he}'s survived, the choices {he}'s made, the people who've followed {him} into the dark. {He} is not who {he} was in Blasingdell's muddy square.`,
{ t: () => `**Level 3 reached.** Everyone is fully rested.\n\n` + (G.tmp.lvlLines || []).join('\n\n') },
{ if: () => !G.hero.sub, t: `**Choose your path.**` }],
  choices: [
    ...['Fighter', 'Rogue', 'Cleric', 'Wizard'].flatMap(cls => SUBCLASSES[cls].map(([id, name, desc]) => ({
      k: 'sub_' + id, label: `**${name}.** ${desc}`, if: () => G.hero.cls === cls && !G.hero.sub,
      t: `{Name} feels the choice settle into {him} like a blade into its sheath.`, do: () => applySubclass(id), go: () => G.tmp.afterLevel || 'kw_vault'
    })))
  ]
},
kw_reward: {
  title: 'The commissioned pieces',
  text: [`The commissioned pieces lie on their cedar shelf in oiled cloth, each with a small bronze tag stamped with a name: allies of the clan who paid in advance a century ago and never came to collect. The work is beautiful: plain, heavy, perfect, the way only dwarves make things.`, `There are several. The clan would want them used. Choose one.`],
  choices: [
    ...[['shield1', 'Fighter', 'A **+1 shield**: steel-faced oak with a hammer-in-a-ring boss. Tag: "For Captain Brannoc, of the Valley Watch."'],
      ['boots', 'Rogue', '**Boots of Elvenkind**: soft gray leather, made for a halfling scout. Tag: "For Tibbet Quickstep, with thanks." Advantage on Stealth.'],
      ['amulet', 'Cleric', 'An **Amulet of the Devout +1**: a silver sunburst. Tag: "For Mother Isolde of the Dawn Temple." +1 to spell attacks and DCs, extra Channel Divinity.'],
      ['wand', 'Wizard', 'A **Wand of the War Mage +1**: dark wood capped in bronze. Tag: "For the wizard Varo, who will understand." +1 to spell attacks.'],
      ['finetools', 'Rogue', '**Masterwork thieves\u2019 tools** so fine they\u2019re almost jewelry. Advantage on lockpicking.']]
      .map(([id, cls, label]) => ({ k: 'r_' + id, label: () => (G.hero.cls === cls ? '★ ' : '') + label, if: () => rewardEligible(id).length > 0 && !(id === 'finetools' && G.hero.cls !== 'Rogue'), do: () => { G.tmp.rewardItem = id; }, go: 'kw_reward_give' }))
  ]
},
kw_reward_give: {
  title: 'Who takes it?',
  text: [{ t: () => `The ${ITEMS[G.tmp.rewardItem].name}. Who should have it?` }],
  choices: [
    { k: 'hero', label: 'Keep it yourself', if: () => rewardEligible(G.tmp.rewardItem).includes(G.hero), do: () => applyReward(G.tmp.rewardItem, G.hero), go: 'kw_vault' },
    ...['tamsin', 'pell', 'kestrel', 'brynja'].map(id => ({
      k: 'g_' + id, label: `Give it to ${SIDEKICKS[id].name.split(' ')[0]}`, if: () => sk(id) && rewardEligible(G.tmp.rewardItem).some(u => u.id === id),
      t: () => (REWARD_LINES[id] && REWARD_LINES[id][G.tmp.rewardItem]) || `${SIDEKICKS[id].name.split(' ')[0]} takes it with a nod.`,
      do: () => applyReward(G.tmp.rewardItem, skObj(id)), go: 'kw_vault' })),
    { k: 'back', label: 'Choose a different piece', once: false, go: 'kw_reward' }
  ]
},

/* ---------------- THE WARBAND ---------------- */
kw_warband: {
  title: 'Sunset',
  enter: () => {
    if (!f('wb_started')) {
      setF('wb_started');
      G.n.prep = 2 + (f('rook_warned') ? 1 : 0) + (hasBrugg() ? 1 : 0) + (f('read_camp') ? 1 : 0);
      G.n.prep = Math.min(4, G.n.prep);
      if (f('read_camp') || f('rook_warned') || sk('kestrel')) setF('wb_spotted');
      if (hasBrugg()) setF('brugg_warned');
    }
  },
  text: [
`They come out of the forge-cellar into a red sunset. The wind has dropped. Somewhere below the crag, a dog is barking, or something that sounds like a dog.`,
{ if: () => f('wb_spotted'), t: `{Name} sees them: torches, a long line of them, winding up the switchbacks from the road below. Twenty, maybe more. And at their head, a big figure with a blade in each hand that catches the last of the light and swallows it.` },
{ if: () => f('brugg_warned'), t: `A figure scrambles over the broken wall at the far end of the courtyard, alone, and drops to the flagstones: a thin young orc with one tusk broken short. Brugg. He holds up his empty hands. "Ruk comes," he says, breathless. "Big one sends him. Burn the old place, kill the diggers. He knows you're here." He swallows. "You let me go. So I tell you."` },
{ if: () => f('wb_spotted'), t: () => `*There's time to prepare: ${num('prep')} ${num('prep') === 1 ? 'action' : 'actions'} left.*` }],
  choices: [
    { k: 'watch', label: 'Keep watch on the road', if: () => !f('wb_spotted'),
      check: { skill: 'perception', dc: () => (f('orcs_prepared') ? 14 : 12), mode: 'best' },
      ok: { t: `Torches. A long line of them, winding up the switchbacks. Twenty, maybe more, and at their head a big figure with a blade in each hand. There's time, just, to prepare.`, do: () => setF('wb_spotted') },
      fail: { t: `The first torch appears in the gateway rubble before anyone sees it coming.`, do: () => setF('kw_surprised'), go: 'combat:ruk' } },
    { k: 'barricade', label: 'Barricade the gateway (Athletics DC 12)', if: () => f('wb_spotted') && num('prep') > 0,
      check: { skill: 'athletics', dc: 12, adv: () => skCount() > 0 },
      ok: { t: `Rubble, a cart, and a fallen beam choke the gate. The orcs will have to climb.`, do: () => { setF('prep_barricade'); addN('prep', -1); } },
      fail: { t: `The beam won't shift, and the light is going. It'll have to do.`, do: () => addN('prep', -1) } },
    { k: 'wall', label: 'Take the wall walk (advantage on ranged attacks in round 1)', if: () => f('wb_spotted') && num('prep') > 0,
      t: `The party climbs to the wall above the courtyard. The orcs will have to fight uphill.`, do: () => { setF('prep_wall'); addN('prep', -1); } },
    { k: 'coals', label: 'Rig the rubble with hot coals from the forge', if: () => f('wb_spotted') && num('prep') > 0,
      check: { skill: ['sleight', 'athletics'], dc: 11 },
      ok: { t: `Buckets of glowing coals go under a thin crust of rubble in the gateway. Anyone who scrambles over it is in for a surprise.`, do: () => { setF('prep_coals'); addN('prep', -1); } },
      fail: { t: `The coals go cold before they're in place.`, do: () => addN('prep', -1) } },
    { k: 'sentinel', label: 'Station the Sentinel at the gate', if: () => f('wb_spotted') && num('prep') > 0 && f('sentinel_obeys') && sentinelUsable(),
      t: `It walks to the gateway and stands there like a door made of mountain.`, do: () => { setF('prep_sentinel'); addN('prep', -1); } },
    { k: 'wake', label: 'Wake the frozen Sentinel', if: () => f('wb_spotted') && num('prep') > 0 && f('sentinel_stopped') && !f('sentinel_obeys') && sentinelUsable(),
      check: { skill: ['arcana', 'history'], dc: () => (sk('brynja') || isSpecies('dwarf') ? 12 : 14) },
      ok: { t: () => (sk('brynja') || isSpecies('dwarf') ? `The ward-rune flares, and the Sentinel wakes, and it remembers who woke it.` : `It wakes, confused and angry, and lurches toward the nearest movement. With luck, that will be the orcs.`), do: () => { setF(sk('brynja') || isSpecies('dwarf') ? 'prep_sentinel' : 'prep_sentinel_wild'); addN('prep', -1); } },
      fail: { t: `The rune stays dark.`, do: () => addN('prep', -1) } },
    { k: 'lure', label: 'Leave the Sentinel on its rounds: the orcs will have to go through it', if: () => f('wb_spotted') && num('prep') > 0 && f('sentinel_avoided') && sentinelUsable(),
      t: `No one touches it. It walks its circuit, as it has for a hundred years, straight across the path from the gate.`, do: () => { setF('prep_sentinel_wild'); addN('prep', -1); } },
    { k: 'brugg', label: 'Ask Brugg to talk to the youngbloods', if: () => f('wb_spotted') && num('prep') > 0 && f('brugg_warned'),
      check: { skill: 'persuasion', dc: 12 },
      ok: { t: `Brugg nods, hesitates, and slips back over the wall. When the warband arrives, two places in the line of torches will be empty.`, do: () => { setF('prep_brugg'); addN('prep', -1); } },
      fail: { t: `"They won't listen to me," Brugg says miserably. "They're more afraid of Ruk."`, do: () => addN('prep', -1) } },
    { k: 'rest', label: 'Catch your breath and bind wounds', if: () => f('wb_spotted') && num('prep') > 0,
      t: `A few minutes, a few bandages, a few deep breaths.`, do: () => { party().forEach(u => { if (u.hp < u.hpMax) healUnit(u, Math.ceil(u.hpMax / 4)); }); addN('prep', -1); } },
    { k: 'ready', label: 'Ready yourselves', if: () => f('wb_spotted'), go: 'kw_ruk_arrives' }
  ]
},
kw_ruk_arrives: {
  title: 'Ruk Two-Blades',
  text: [
`The torches fill the gateway. The orcs come over the rubble in a wave, then stop, because their leader has raised a hand.`,
`Ruk Two-Blades is the biggest orc {Name} has ever seen: broad as a door, scarred like an old chopping block, in mail stitched from three different hauberks. In his right hand, a longsword of black steel. In his left, a handaxe of the same. Both of them drink the torchlight. He looks around the courtyard, at the Watch, at the party, and laughs.`,
`"Little diggers," he says in rough Common. "Big one says burn this place. Big one says kill whoever is in it." He points the black longsword at {Name}. "You took Grosh's sword. You took the Lantern Man's silver. You make the big one angry." He grins. "Good. Ruk likes when it's hard."`,
{ if: () => sk('tamsin'), t: `Tamsin's hand goes to the blue ribbon on her wrist. "Where's my sister?" she says, very quietly.\n\nRuk laughs again. "Under the Tooth. With the big one. Alive, for now. Big one likes servants."` },
{ if: () => f('prep_brugg'), t: `Two places in the line of torches are empty. Ruk hasn't noticed yet.` },
{ if: () => (f('ghared_debt') || f('ghared_respect')) && !f('ghared_dead'), t: `A cold draft moves across the courtyard, where there's no wind, and stops beside the forge door.` }],
  enter: () => { if (sk('tamsin') && !f('tamsin_knows')) { setF('tamsin_knows'); loyal('tamsin', 1); } },
  choices: [
    { k: 'fight', label: 'Fight', go: 'combat:ruk' },
    { k: 'duel', label: 'Challenge Ruk to single combat. (He\u2019s a powerful foe; companions won\u2019t help unless you fall.)',
      check: { skill: 'intimidation', dc: 13, adv: true },
      ok: { t: `"Just you and me, Ruk. Your people stand back. If you win, the Watch is yours. If I win, they leave."\n\nRuk's grin widens. "Yes. Good." He waves his warband back into a ring of torches.`, go: 'combat:ruk_duel' },
      fail: { t: `"Ruk is not stupid." He signals the charge.`, go: 'combat:ruk' } }
  ]
},

/* ---------------- AFTERMATH ---------------- */
kw_aftermath: {
  title: 'Two black blades',
  text: [
`The courtyard of Kelvorn's Watch is a mess of trampled earth, scattered torches still guttering on the flagstones, and the smell of smoke. The stars are coming out over the broken wall. Somewhere down the crag, the last of the warband is still running.`,
{ if: () => f('ruk_dueled'), t: `The orcs carried their chief's body down the road in silence, by torchlight. Nobody looked back.` },
{ if: () => f('ruk_won'), t: `{Name} wakes at dawn to smoke and ash. The hall is burned, its murals blackened. Ruk took the black longsword with him, but left the handaxe buried in stone up to its haft, as if to make a point.` },
{ if: () => !f('ruk_won'), t: `Two black blades lie on the flagstones where Ruk fell: a longsword and a handaxe, both marked near the hilt with the hammer-in-a-ring. Even lying in the mud, they seem to wait.` },
{ if: () => heroIs('aldric') && !f('ruk_won'), t: `{Name} takes out the broken half of {his} old sword and lays it beside the black longsword, and for a long moment just looks at them together.` },
{ if: () => heroIs('mirelle'), t: `{Name}'s own blade hums the moment the black blades come near it, and the black blades hum back: three notes now, almost a chord.` }],
  choices: [
    { k: 'long', label: 'Claim the black longsword (+1)', if: () => !f('ruk_won'), do: () => { G.tmp.claimed = 'black_longsword'; G.tmp.other = 'black_handaxe'; setF('claimed_ruk_longsword'); }, go: 'kw_blade_holder' },
    { k: 'axe', label: 'Claim the black handaxe (+1)', do: () => { G.tmp.claimed = 'black_handaxe'; G.tmp.other = f('ruk_won') ? null : 'black_longsword'; setF('claimed_ruk_handaxe'); }, go: 'kw_blade_holder' }
  ]
},
kw_blade_holder: {
  title: 'The blade',
  text: [`The blade is heavier than it looks, and it settles into a hand like it's been waiting for one. It thrums faintly, as if it's listening.`,
{ if: () => sk('pell') || sk('brynja'), t: () => `${sk('pell') ? 'Pell can\'t bear to hold it. ' : ''}${sk('brynja') ? 'Brynja shakes her head: "I\'m not a fighter. Give it to someone who\'ll use it."' : ''}` }],
  choices: [
    { k: 'hero', label: 'Keep it yourself', do: () => { G.hero.weapons.push(G.tmp.claimed); setF('blade_holder_hero'); }, go: 'kw_second_blade' },
    { k: 'tamsin', label: 'Give it to Tamsin', if: () => sk('tamsin'),
      t: `Tamsin takes it without a word. Then she looks at the ribbon on her wrist, and at the blade, and says, "I'll bring this to the big one. Personally."`,
      do: () => { const s = skObj('tamsin'); s.weapons[0] = G.tmp.claimed; loyal('tamsin', 2); setF('blade_holder_tamsin'); }, go: 'kw_second_blade' },
    { k: 'kestrel', label: 'Give it to Kestrel', if: () => sk('kestrel'),
      t: `"A sword? For me?" She turns it over, raises an eyebrow. "Well. I can always sell it." She doesn't.`,
      do: () => { const s = skObj('kestrel'); s.weapons.push(G.tmp.claimed); loyal('kestrel', 1); setF('blade_holder_kestrel'); }, go: 'kw_second_blade' }
  ]
},
kw_second_blade: {
  title: 'The other blade',
  text: [{ if: () => !!G.tmp.other, t: `The other blade still lies on the flagstones. "Orsik," someone says. "It should go home to the clan."` }, { if: () => !G.tmp.other, t: `There's nothing else to claim. Ruk took the rest.` }],
  choices: [
    { k: 'orsik', label: 'Send it home to Orsik', if: () => !!G.tmp.other, do: () => { setF('second_blade_to_orsik'); }, go: () => (f('brugg_warned') ? 'kw_brugg_after' : 'kw_leaving') },
    { k: 'keep', label: 'Keep it too', if: () => !!G.tmp.other, do: () => { setF('kept_second_ruk_blade'); addN('trust_orsik', -1); const t = !f('blade_holder_tamsin') && sk('tamsin') ? skObj('tamsin') : null; if (t) t.weapons[0] = G.tmp.other; else G.hero.weapons.push(G.tmp.other); }, go: () => (f('brugg_warned') ? 'kw_brugg_after' : 'kw_leaving') },
    { k: 'on', label: 'Continue', if: () => !G.tmp.other, go: () => (f('brugg_warned') ? 'kw_brugg_after' : 'kw_leaving') }
  ]
},
kw_brugg_after: {
  title: 'Brugg',
  text: [
`Brugg comes back over the wall after the others have gone, warily, as if he isn't sure of his welcome. He stands at the edge of the torchlight and looks at Ruk's blades, and then at {Name}.`,
`"Ruk is gone," he says. "Big one will be angry." He shrugs. "Big one is always angry." He hesitates. "The captives. The farm girl and the boy. They're at the big one's door, in a pen. I fed them sometimes. The girl spits at everyone." A flicker of something like respect. "She is like her sister."`,
{ if: () => sk('tamsin'), t: `Tamsin closes her eyes. "Thank you," she says, and it costs her something to say it to an orc.` }],
  choices: [
    { k: 'show', label: '"Show us the way in."', t: `Brugg shakes his head quickly. "No. They kill me." But he crouches and draws in the dirt with a finger: a door in a cliff, a bridge over a crack in the ground, men with bows behind holes in the wall. "Front door. Bridge. Archers." Then he goes, into the dark, and doesn't come back.`, do: () => setF('brugg_map'), go: 'kw_leaving' },
    { k: 'home', label: '"Go home, Brugg. Find somewhere they won\u2019t look."', t: `He nods. At the wall, he turns back once. "You are strange, for a human."`, do: () => setF('brugg_free'), go: 'kw_leaving' }
  ]
},
kw_leaving: {
  title: 'A night in the Watch',
  text: [
`They spend the night in the Watch, because nobody wants to walk down the crag in the dark. Somebody builds up the fire in the old forge, and for the first time in a hundred years, Kelvorn's Watch is warm.`,
{ if: () => (f('sentinel_obeys') || f('prep_sentinel')) && !f('sentinel_destroyed'), t: `The Sentinel stands in the gateway all night, unmoving, its amber eyes glowing faintly. In the morning, {Name} tells it to keep watching the Watch. It bows its great stone head. Somehow, that feels right.` },
{ if: () => sk('brynja'), t: () => `Brynja sits up half the night by the forge${f('has_forge_notes') ? ' with Durgeddin\'s notebooks, turning pages by firelight, not reading, just looking' : ', staring into the coals'}.` },
{ if: () => sk('pell'), t: `Pell sits with each of them in turn and checks their bandages, whether they need checking or not.` },
{ if: () => sk('tamsin'), t: `Tamsin sits on the wall, facing north, with her sword across her knees, and doesn't sleep at all.` },
{ if: () => sk('kestrel'), t: `Kestrel takes the first watch, and the second, and the third, and complains about it the whole time.` },
`In the morning, they go south.`],
  enter: () => { if (!f('kw_rested')) { setF('kw_rested'); longRest(); } },
  choices: [{ k: 'go', label: 'Return to Blasingdell', go: 'kw_return' }]
},
kw_return: {
  title: 'Blasingdell',
  text: [
`Blasingdell has never looked so small, or so welcome. The smithy clangs, the mud sucks at their boots, and the smell of coal smoke wraps around them like an old coat. People in the square stop and stare: word of the raiders has gotten around, and so has word of who's been hunting them.`,
{ if: () => f('harl_saved'), t: () => `Harl Varr is in town, leaning on a stick outside the temple. When he sees {Name}, he limps over and grips {his} hand in both of his.${sk('tamsin') ? ' Then he sees the ribbon on Tamsin\'s wrist, and he has to sit down on the temple steps.' : ''}` },
{ if: () => f('kuln_respect') || f('kuln_rook_jailed'), t: `Sergeant Kuln catches {Name}'s eye across the square and nods once, the way one soldier nods to another.` }],
  choices: [
    { k: 'ribbon', label: 'Give Courana\u2019s ribbon to Tamsin', if: () => hasItem('ribbon') && sk('tamsin'), t: `Tamsin takes it, and ties it around her wrist, and doesn't say anything for a while.`, do: () => { useItem('ribbon'); loyal('tamsin', 1); } },
    { k: 'orsik', label: 'Go to Orsik\u2019s workshop', go: 'kw_orsik_final' }
  ]
},
kw_orsik_final: {
  title: 'Durgeddin the Black',
  text: [
`Orsik is waiting in his workshop, as if he hasn't moved since they left. The fire is low. The tea is cold.`,
`{Name} lays the full map on the workbench, and beside it, the journal, and the black blades.`,
`Orsik looks at the map for a long time. At the spire. At the word *Khundrukar*.`,
`"Durgeddin the Black," he says at last, and his voice is steady. "That is the name. That is the mark on the blades. My clan's lord, a hundred years dead, and the greatest smith our people ever had. And the angriest." He touches the hammer-in-a-ring on the map. "His hold fell. His people died. My clan was one of the few that got out, and we have lived ever since in other people's mountains, telling stories about the hold under the Tooth." He looks up. "Now the orcs dig in his vaults and sell his blades for silver. And gray dwarves come to steal his secrets."`],
  enter: () => setF('knows_durgeddin', 'knows_khundrukar', 'knows_stone_tooth'),
  choices: [
    { k: 'inscr', label: 'Tell him about the inscription in the Hall of Records', if: () => f('found_haldar_inscription') && !f('told_inscription'),
      t: `{Name} tells him: the careful square letters, low on the wall, the little carved sun. *Tell my father I found it.* Orsik goes very still.`, do: () => { setF('told_inscription'); addN('trust_orsik', 2); }, go: () => (num('trust_orsik') >= 3 ? 'kw_orsik_haldar' : null) },
    { k: 'notes', label: 'Give him Durgeddin\u2019s notebooks', if: () => hasItem('forge_notes'),
      t: `His hands shake as he turns the pages. "*A blade must be taught what to hate,*" he reads, very quietly. "So that was the secret." He closes the book. "I don't know if I want to understand it." He locks them away.`, do: () => { useItem('forge_notes'); setF('notes_to_orsik'); addN('trust_orsik', 1); } },
    { k: 'duergar', label: 'Tell him the duergar have the notes', if: () => f('notes_to_ghared') || f('notes_stolen'),
      t: `He's silent a long time. "Then they'll be at the forge before us." He doesn't blame {Name}. He doesn't need to.`, do: () => addN('trust_orsik', -1) },
    { k: 'blade', label: 'Give him the second blade', if: () => f('second_blade_to_orsik') && !f('second_blade_given'), t: `"It comes home," he says, and wraps it in clean cloth.`, do: () => { setF('second_blade_given'); addN('trust_orsik', 1); } },
    { k: 'else', label: '"There\u2019s something else, isn\u2019t there?"', if: () => num('trust_orsik') >= 3 && !f('orsik_confessed'), go: 'kw_orsik_haldar' },
    { k: 'now', label: '"What happens now?"', go: 'kw_orsik_payment' }
  ]
},
kw_orsik_haldar: {
  title: 'Haldar',
  enter: () => setF('orsik_confessed'),
  text: [
`Orsik sits down slowly on his stool by the fire. He looks very old.`,
`"I had a son," he says. "Haldar. Clever. Stubborn. Like Brynja, but worse." A ghost of a smile. "He grew up on the stories. Khundrukar. Durgeddin. The hold under the Tooth. And when he was grown, he said he would find it. I told him it was a fool's errand. I told him the hold was a grave. He went anyway, with friends he'd hired: a wizard, a thief, a few others."`,
`He stares into the fire. "That was eleven years ago. None of them came back."`,
{ if: () => f('found_haldar_inscription'), t: `"*Tell my father I found it,*" {Name} says quietly. Orsik makes a sound like something tearing, and puts his face in his hands. When he looks up again, his eyes are wet, but there's something new in them. "He found it," he says. "He *found* it."` },
`"I didn't tell you, before, because I didn't want to send anyone else into that grave after him." He takes a breath. "But the orcs are in it now, and the gray dwarves, and the Varr girl, and the Geradil boy. And perhaps..." He stops. "Perhaps there's something of him there still. Something to bring home."`,
{ if: () => sk('brynja'), t: `Brynja puts her hand on the old dwarf's shoulder and leaves it there.` }],
  choices: [{ k: 'on', label: 'Continue', go: 'kw_orsik_payment' }]
},
kw_orsik_payment: {
  title: 'The road north',
  enter: () => { if (!f('orsik_paid200')) { setF('orsik_paid200'); G.gold += 200; log('Received 200 gp from Orsik.', 'good'); if (sk('brynja')) loyal('brynja', 1); } },
  text: [
`Orsik stands and fetches a heavy purse from a locked drawer. "Two hundred," he says. "As I promised. You found the source." He sets it on the bench.`,
{ t: () => `Then he puts his hand flat on the map, over the spire. "I'm asking you to go," he says. "To the Stone Tooth. Bring back the Varr girl and the Geradil boy. Stop the orcs. Keep Durgeddin's forge out of gray hands.${f('orsik_confessed') ? ' And if you find my son... bring him home. Whatever\'s left.' : ''}" He swallows. "I can't pay you what it's worth. Nobody could. But the clan will remember, and so will I."` },
{ if: () => sk('tamsin'), t: `"We're going," Tamsin says. "That was never a question."` },
{ if: () => sk('brynja'), t: `"I'm coming," Brynja says, before he can forbid it. Orsik looks at her for a long moment, and then, to everyone's surprise, nods. "Yes. You should."` }],
  choices: [{ k: 'go', label: '"We\u2019ll go."', go: 'prologue_end' }]
},
prologue_end: {
  title: 'The Stone Tooth',
  text: [
`Three days later, they leave Blasingdell at dawn by the north gate, with packs full of rations and rope and lamp oil, and the full map rolled in its case.`,
{ t: () => `The road runs north past the hill farms, past the Varr homestead ${f('barn_lost') ? 'with its new barn rising from the ashes' : 'with its scorched old barn still standing'}, past the crag of Kelvorn's Watch${(f('sentinel_obeys') || f('prep_sentinel')) && !f('sentinel_destroyed') ? ', where something gray stands in the gateway and lifts its hammer as they pass' : ''}, and on into the wild hills.` },
`On the third evening, they see it: a forested crag rising out of the hills, and from its top, a single spire of stone, sharp as a fang against the red sky.`,
`The Stone Tooth.`,
{ t: () => `Somewhere under it is a lost hold, a dead smith's forge, an ogre who calls himself Great, two captives from a burned farm, and eleven years of silence. ${({ aldric: 'And the weapon that broke {Name}\'s sword.', nyssa: 'And the end of a trail {Name} never wanted to start.', teodor: 'And a darkness that needs a light.', mirelle: 'And the answer to why the blades hate.' })[G.hero.id]}` },
`{Name} touches the black blade at {his} side. It thrums, very faintly, as if it knows where it is.`,
`**THE END OF *THE BLACK BLADES*.**`,
`Your story continues in **Book Two: *The Forge of Fury***. Export your save file now: the next game will load it and carry forward your hero, your companions, your gear, and every choice you've made.`],
  enter: () => setF('prologue_complete'),
  choices: [
    { k: 'export', label: 'Export save file', once: false, run: () => { exportSave(); return { t: 'Save file downloaded.' }; } },
    { k: 'quick', label: 'Quick-save in this browser', once: false, run: () => { quickSave(); return { t: 'Saved in this browser.' }; } }
  ]
}
});

function puzzleFail() {
  setF('puzzle_tried');
  const hit = [];
  party().forEach(u => { const sv = d20({ luck: !!u.luck }).value + saveBonus(u, 'con'); if (sv < 11) hit.push(u.name); });
  return `The wrong runes. The door shudders, and from the hollow a puff of stinging dust bursts out${hit.length ? `: ${hit.join(' and ')} ${hit.length > 1 ? 'are' : 'is'} left coughing, eyes streaming` : ', but everyone gets clear'}. The runes reset. The dust has knocked loose more moss; the carvings are easier to see now.`;
}

/* =========================================================
